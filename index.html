                                                    <label class="block text-[10px] font-bold text-muji-muted">12. No. Kenderaan (Pejabat):</label>
                                                    <div class="flex items-center gap-1">
                                                        <button type="button" onclick="openAddOfficeVehicleModal(${b.id})" title="Tambah No. Kenderaan Pejabat Baru" class="px-2 py-0.5 rounded bg-emerald-600 text-white text-[9px] font-bold hover:bg-emerald-700 flex items-center gap-0.5 shadow-sm">
                                                            <i class="fas fa-plus"></i> Tambah
                                                        </button>
                                                        <button type="button" onclick="deleteSelectedOfficeVehicle(${b.id})" title="Padam No. Kenderaan yang dipilih" class="px-2 py-0.5 rounded bg-red-600 text-white text-[9px] font-bold hover:bg-red-700 flex items-center gap-0.5 shadow-sm">
                                                            <i class="fas fa-trash-alt"></i> Padam
                                                        </button>
                                                    </div>
                                                </div>
                                                <select id="assign-veh-${b.id}" class="w-full p-2 rounded-lg bg-white border border-muji-border text-xs">
                                                    ${(state.officeVehicles || []).map(v => `<option value="${v.label}" ${(td.assignedVehicle === v.label) ? 'selected' : ''}>${v.code} ${v.label}</option>`).join('')}
                                                </select>
                                            </div>
                                            <div class="sm:col-span-4">
                                                <div class="flex justify-between items-center mb-1">
                                                    <label class="block text-[10px] font-bold text-muji-muted">13. Nama Pemandu (Pejabat):</label>
                                                    <div class="flex items-center gap-1">
                                                        <button type="button" onclick="openAddOfficeDriverModal(${b.id})" title="Tambah Pemandu Baru" class="px-2 py-0.5 rounded bg-emerald-600 text-white text-[9px] font-bold hover:bg-emerald-700 flex items-center gap-0.5 shadow-sm">
                                                            <i class="fas fa-plus"></i> Tambah
                                                        </button>
                                                        <button type="button" onclick="deleteSelectedOfficeDriver(${b.id})" title="Padam Pemandu yang dipilih jika tiada" class="px-2 py-0.5 rounded bg-red-600 text-white text-[9px] font-bold hover:bg-red-700 flex items-center gap-0.5 shadow-sm">
                                                            <i class="fas fa-trash-alt"></i> Padam
                                                        </button>
                                                    </div>
                                                </div>
                                                <select id="assign-drv-${b.id}" class="w-full p-2 rounded-lg bg-white border border-muji-border text-xs">
                                                    ${(state.officeDrivers || []).map(d => `<option value="${d.label}" ${(td.assignedDriver === d.label) ? 'selected' : ''}>${d.code} ${d.label}</option>`).join('')}
                                                </select>
                                            </div>
                                            <div class="sm:col-span-2">
                                                <button onclick="saveTransportOfficeAssignment(${b.id}, true)" class="w-full py-2 px-3 bg-muji-accent text-white rounded-lg text-xs font-semibold hover:bg-muji-accentDark">
                                                    <i class="fas fa-save mr-1"></i> Simpan Pejabat
                                                </button>
                                            </div>
                                        </div>

                                        <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-muji-border/70">
                                            <div class="flex flex-wrap items-center gap-2 text-[11px]">
                                                <span class="px-2.5 py-1 rounded-lg border ${td.assetOfficerStatus === 'approved' ? 'bg-teal-50 border-teal-300 text-teal-800' : (td.assetOfficerStatus === 'rejected' ? 'bg-red-50 border-red-300 text-red-700' : 'bg-white border-gray-200 text-muji-muted')} font-semibold">
                                                    <b>No. 10 Pegawai Aset:</b> ${td.assetOfficerStatus === 'approved' ? '✅ Disokong' : (td.assetOfficerStatus === 'rejected' ? '❌ Tidak Disokong' : '⏳ Belum Disahkan')}
                                                    ${td.assetOfficerSignature ? ' (Signed)' : ''}
                                                </span>
                                                <span class="px-2.5 py-1 rounded-lg border ${td.headDeptStatus === 'approved' ? 'bg-purple-50 border-purple-300 text-purple-800' : (td.headDeptStatus === 'rejected' ? 'bg-red-50 border-red-300 text-red-700' : 'bg-white border-gray-200 text-muji-muted')} font-semibold">
                                                    <b>No. 11 Ketua Jabatan:</b> ${td.headDeptStatus === 'approved' ? '✅ DILULUSKAN' : (td.headDeptStatus === 'rejected' ? '❌ TIDAK DILULUSKAN' : '⏳ Belum Diluluskan')}
                                                    ${td.headDeptSignature ? ' (Signed)' : ''}
                                                </span>
                                            </div>
                                            <div class="flex flex-wrap gap-1.5">
                                                <button onclick="openOfficialDigitalSignModal(${b.id}, '10')" class="px-2.5 py-1.5 bg-teal-600 text-white rounded-lg text-[11px] font-bold hover:bg-teal-700 flex items-center gap-1 shadow-sm">
                                                    <i class="fas fa-file-signature"></i> Sign No. 10 (Pegawai Aset)
                                                </button>
                                                ${(td.assetOfficerStatus === 'approved' && td.assetOfficerSignature) ? `
                                                    <button onclick="openOfficialDigitalSignModal(${b.id}, '11')" class="px-2.5 py-1.5 bg-purple-600 text-white rounded-lg text-[11px] font-bold hover:bg-purple-700 flex items-center gap-1 shadow-sm">
                                                        <i class="fas fa-stamp"></i> Lulus & Sign No. 11 (Ketua Jabatan)
                                                    </button>
                                                ` : `
                                                    <button type="button" onclick="customAlert('Permohonan ini perlu mendapat <b>Sokongan & Tandatangan Digital</b> pada bahagian <b>10. Pegawai Aset / Kenderaan</b> terlebih dahulu sebelum boleh masuk ke kelulusan <b>11. Ketua Jabatan</b>.')" class="px-2.5 py-1.5 bg-gray-200 text-gray-500 rounded-lg text-[11px] font-bold cursor-not-allowed flex items-center gap-1">
                                                        <i class="fas fa-lock"></i> No. 11 (Menunggu Sokongan No. 10)
                                                    </button>
                                                `}
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
                `}
            </div>
        `;
    }

    function renderDigitalSignerDashboard(container, step) {
        const isStep10 = step === '10';
        const todayStr = formatDateISO(new Date());
        const showArchive = isStep10 ? showArchiveBasketSigner10 : showArchiveBasketSigner11;
        const allTransportBookings = state.bookings.filter(b => b.type === 'transport');

        const eligibleBookings = isStep10
            ? allTransportBookings
            : allTransportBookings.filter(b => {
                const td = b.transportDetails || {};
                return td.assetOfficerStatus === 'approved' && Boolean(td.assetOfficerSignature);
            });

        const activeActionList = eligibleBookings.filter(b => !isBookingArchivedForSigner(b, step, todayStr));
        const archivedBasketList = eligibleBookings.filter(b => isBookingArchivedForSigner(b, step, todayStr));
        const transportBookings = showArchive ? archivedBasketList : activeActionList;

        const waitingStep10Count = allTransportBookings.filter(b => {
            const td = b.transportDetails || {};
            return td.assetOfficerStatus !== 'approved' || !td.assetOfficerSignature;
        }).length;

        const headerBadge = isStep10
            ? `<span class="px-3 py-1 rounded-full text-xs font-bold bg-teal-100 text-teal-800 border border-teal-300">Peringkat 1 — Bahagian No. 10 Borang Rasmi</span>`
            : `<span class="px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-800 border border-purple-300">Peringkat 2 — Bahagian No. 11 Borang Rasmi</span>`;

        const titleText = isStep10
            ? 'Dashboard Penandatangan Digital — 10. Sokongan & Pengesahan Pegawai Aset / Kenderaan'
            : 'Dashboard Penandatangan Digital — 11. Kelulusan Ketua Jabatan (Diluluskan / Tidak Diluluskan)';

        const subtitleText = showArchive
            ? `Memaparkan rekod di dalam <b>Bakul Simpanan</b> (Permohonan yang telah dibuat tindakan ${isStep10 ? 'Sokong / Tidak Sokong' : 'Diluluskan / Tidak Diluluskan'} atau telah melepasi tarikh permohonan).`
            : (isStep10
                ? 'Hanya memaparkan permohonan semasa yang masih perlu tindakan Sokong / Tidak Sokong & Tandatangan Digital (No. 10).'
                : 'Hanya memaparkan permohonan semasa (yang telah disokong pada No. 10) untuk tindakan Kelulusan Ketua Jabatan (No. 11).');

        container.innerHTML = `
            <div class="space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-muji-border flex flex-wrap justify-between items-center gap-3">
                    <div class="max-w-2xl">
                        <div class="mb-1">${headerBadge}</div>
                        <h2 class="text-lg md:text-xl font-bold text-muji-text">${titleText}</h2>
                        <p class="text-xs text-muji-muted mt-0.5">${subtitleText}</p>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <div class="flex flex-wrap items-center gap-2">
                            <button type="button" onclick="toggleArchiveBasket('${isStep10 ? 'signer10' : 'signer11'}')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 shadow-sm ${!showArchive ? (isStep10 ? 'bg-teal-600 text-white ring-2 ring-teal-300' : 'bg-purple-600 text-white ring-2 ring-purple-300') : 'bg-muji-bg text-muji-text border border-muji-border'}">
                                <i class="fas fa-bolt"></i>
                                <span>Perlu Tindakan Semasa</span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] ${!showArchive ? 'bg-white text-slate-800' : 'bg-amber-100 text-amber-800'} font-bold">${activeActionList.length}</span>
                            </button>
                            <button type="button" onclick="toggleArchiveBasket('${isStep10 ? 'signer10' : 'signer11'}')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 shadow-sm ${showArchive ? 'bg-slate-700 text-white ring-2 ring-slate-400' : 'bg-muji-bg text-muji-text border border-muji-border hover:border-slate-500'}">
                                <i class="fas fa-archive"></i>
                                <span>Bakul Simpanan</span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] ${showArchive ? 'bg-white text-slate-800' : 'bg-slate-200 text-slate-700'} font-bold">${archivedBasketList.length}</span>
                            </button>
                        </div>
                        ${!isStep10 && waitingStep10Count > 0 ? `
                            <div class="text-[10px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg">
                                <i class="fas fa-hourglass-half mr-1"></i>${waitingStep10Count} permohonan masih menunggu sokongan No. 10
                            </div>
                        ` : ''}
                    </div>
                </div>

                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-muji-muted">
                        ${showArchive
                            ? `<i class="fas fa-box-open mr-1 text-slate-600"></i>Senarai Dalam Bakul Simpanan (${transportBookings.length} Permohonan)`
                            : `<i class="fas fa-signature mr-1 ${isStep10 ? 'text-teal-600' : 'text-purple-600'}"></i>Senarai Perlu Tindakan Semasa (${transportBookings.length} Permohonan)`}
                    </span>
                    <span class="text-[11px] text-muji-muted font-semibold"><i class="fas fa-arrows-alt-v mr-1"></i>Scroll</span>
                </div>

                ${transportBookings.length === 0 ? `
                    <div class="bg-white p-8 rounded-2xl border border-muji-border text-center space-y-2">
                        <i class="fas ${showArchive ? 'fa-box-open text-slate-400' : (isStep10 ? 'fa-check-circle text-teal-600' : 'fa-check-circle text-purple-600')} text-2xl"></i>
                        <p class="text-xs font-bold text-muji-text">
                            ${showArchive
                                ? 'Tiada rekod di dalam Bakul Simpanan buat masa ini.'
                                : (isStep10
                                    ? 'Tiada permohonan kenderaan baharu yang menunggu tindakan Sokongan No. 10 pada waktu semasa.'
                                    : 'Tiada permohonan semasa yang menunggu Kelulusan Ketua Jabatan (No. 11).')}
                        </p>
                        <p class="text-[11px] text-muji-muted max-w-md mx-auto">
                            ${showArchive
                                ? 'Semua permohonan yang telah diambil tindakan atau telah melepasi tarikh akan dipindahkan ke sini secara automatik.'
                                : `Anda boleh klik butang <b>"Bakul Simpanan (${archivedBasketList.length})"</b> di atas untuk melihat semula permohonan yang telah selesai diambil tindakan atau lepas tarikh.`}
                        </p>
                    </div>
                ` : `
                    <div class="space-y-4 max-h-[65vh] overflow-y-auto pr-1 pb-2 scroll-smooth">
                        ${transportBookings.map(b => {
                            const td = b.transportDetails || {};
                            const item = state.transports.find(i => Number(i.id) === Number(b.itemId));
                            const itemName = item ? item.name : (b.itemName || 'Kenderaan Sekolah');
                            const slotNames = formatSlotDisplay(b);
                            const isPast = normalizeDateToISO(b.date) < todayStr;

                            const stepStatus = isStep10 ? td.assetOfficerStatus : td.headDeptStatus;
                            const stepSignImg = isStep10 ? td.assetOfficerSignature : td.headDeptSignature;
                            const stepSignerName = isStep10 ? td.assetOfficerName : td.headDeptName;
                            const stepSignerStamp = isStep10 ? td.assetOfficerStamp : td.headDeptStamp;
                            const stepSignDate = isStep10 ? td.assetOfficerDate : td.headDeptDate;

                            let statusPill = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">⏳ ${isStep10 ? 'Menunggu Sokongan & Sign Digital (No. 10)' : 'Telah Disokong No. 10 • Menunggu Kelulusan No. 11'}</span>`;
                            if (stepStatus === 'approved') {
                                statusPill = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-green-100 text-green-800">✅ ${isStep10 ? 'Disokong & Dihantar ke No. 11' : 'DILULUSKAN'}</span>`;
                            } else if (stepStatus === 'rejected') {
                                statusPill = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-red-100 text-red-800">❌ ${isStep10 ? 'Tidak Disokong (Tidak Dihantar ke No. 11)' : 'TIDAK DILULUSKAN'}</span>`;
                            }

                            return `
                                <div class="bg-white p-5 rounded-2xl shadow-sm border border-muji-border space-y-3">
                                    <div class="flex flex-wrap justify-between items-start gap-2 border-b border-muji-border pb-3">
                                        <div>
                                            <div class="flex items-center gap-2 flex-wrap">
                                                <span class="px-2.5 py-0.5 rounded-md bg-amber-100 text-amber-900 font-bold text-[10px]">No. Siri: ${td.refNo || '-'}</span>
                                                <h4 class="font-bold text-sm text-muji-text">${itemName}</h4>
                                                <span class="text-xs font-semibold text-muji-muted">• Tarikh Bertolak: <b class="text-muji-text">${b.date}</b></span>
                                                ${isPast ? `<span class="px-2 py-0.5 text-[9px] rounded-full bg-slate-200 text-slate-700 font-bold"><i class="fas fa-history mr-0.5"></i>Lepas Tarikh</span>` : ''}
                                            </div>
                                            <p class="text-xs text-muji-text mt-1">
                                                <b>1. Pemohon:</b> ${b.teacherName} (${td.applicantPosition || b.form}) • <b>2. Unit:</b> ${b.subject} (${b.className})
                                            </p>
                                        </div>
                                        <div class="flex items-center gap-2">${statusPill}</div>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs bg-muji-bg p-3.5 rounded-xl border border-muji-border">
                                        <div>
                                            <p class="text-muji-muted text-[10px] uppercase font-bold">Butiran Perjalanan</p>
                                            <p class="mt-0.5"><b>4. Tujuan:</b> ${b.purpose}</p>
                                            <p><b>5. Destinasi:</b> ${td.destination || '-'}</p>
                                            <p><b>3. Penumpang:</b> ${td.totalPassengers || '-'} orang (Guru: ${td.guruCount || '-'}, Pelajar: ${td.studentCount || '-'})</p>
                                        </div>
                                        <div>
                                            <p class="text-muji-muted text-[10px] uppercase font-bold">Jadual Pergi & Balik</p>
                                            <p class="mt-0.5"><b>8.3 Pergi:</b> ${td.goDateDay || b.date} (${td.goTime || slotNames}) dari ${td.goLocation || 'SMKA Maahad Muar'}</p>
                                            <p><b>8.4 Balik:</b> ${td.backDateDay || b.date} (${td.backTime || '-'}) dari ${td.backLocation || td.destination || '-'}</p>
                                            <p><b>12/13 Pejabat:</b> ${td.assignedVehicle || '-'} / ${td.assignedDriver || '-'}</p>
                                        </div>
                                        <div class="bg-white p-2.5 rounded-xl border border-muji-border flex flex-col justify-between">
                                            <div class="text-[10px] font-bold text-muji-muted uppercase">${isStep10 ? '10. Rekod Tandatangan Pegawai Aset' : '11. Rekod Tandatangan Ketua Jabatan'}</div>
                                            ${stepSignImg ? `
                                                <div class="my-1 flex items-center gap-2">
                                                    <img src="${stepSignImg}" class="h-10 object-contain border border-dashed border-gray-300 rounded bg-white px-2">
                                                    <div class="text-[10px] leading-tight">
                                                        <div class="font-bold text-muji-text">${stepSignerName || '-'}</div>
                                                        <div class="text-muji-muted">${stepSignerStamp || ''}</div>
                                                        <div class="text-muji-muted">Tarikh: ${stepSignDate || b.date}</div>
                                                    </div>
                                                </div>
                                            ` : `<p class="text-[11px] text-amber-700 italic my-2">Belum ditandatangani secara digital.</p>`}
                                            <div class="text-[10px] text-muji-muted">
                                                Status No. ${isStep10 ? '11 (Ketua Jabatan)' : '10 (Pegawai Aset)'}:
                                                <b>${isStep10
                                                    ? (td.headDeptStatus === 'approved' ? 'Diluluskan' : (td.headDeptStatus === 'rejected' ? 'Tidak Diluluskan' : 'Menunggu Sokongan No. 10'))
                                                    : (td.assetOfficerStatus === 'approved' ? '✅ Disokong & Ditandatangani' : 'Tidak Disokong')}</b>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex flex-wrap justify-between items-center gap-2 pt-1">
                                        <button onclick="generateTransportOfficialPDF(${b.id})" class="px-3.5 py-2 bg-amber-700 text-white rounded-xl text-xs font-semibold hover:bg-amber-800 flex items-center gap-1.5 shadow-sm">
                                            <i class="fas fa-file-pdf"></i> Pratonton / Cetak Borang PDF
                                        </button>
                                        <div class="flex flex-wrap items-center gap-2">
                                            <button onclick="openOfficialDigitalSignModal(${b.id}, '${step}', 'approved')" class="px-4 py-2 ${isStep10 ? 'bg-teal-600 hover:bg-teal-700' : 'bg-purple-600 hover:bg-purple-700'} text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                                <i class="fas fa-signature"></i> ${isStep10 ? 'Sokong & Sign Digital (No. 10)' : 'DILULUSKAN & Sign Digital (No. 11)'}
                                            </button>
                                            <button onclick="openOfficialDigitalSignModal(${b.id}, '${step}', 'rejected')" class="px-3.5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                                <i class="fas fa-times-circle"></i> ${isStep10 ? 'Tidak Sokong' : 'TIDAK DILULUSKAN'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `}
            </div>
        `;
    }

    function openOfficialDigitalSignModal(bookingId, step, presetDecision = 'approved') {
        const b = state.bookings.find(x => Number(x.id) === Number(bookingId));
        if (!b) return;
        if (!b.transportDetails) b.transportDetails = {};
        const td = b.transportDetails;

        // Sekat pembukaan modal No. 11 jika No. 10 belum mendapat sokongan & tandatangan digital
        if (step === '11' && (td.assetOfficerStatus !== 'approved' || !td.assetOfficerSignature)) {
            customAlert('Permohonan ini perlu mendapat <b>Sokongan & Tandatangan Digital</b> pada bahagian <b>10. Pegawai Aset / Kenderaan</b> terlebih dahulu sebelum boleh diluluskan oleh <b>11. Ketua Jabatan</b>.');
            return;
        }

        activeOfficialSignModalBookingId = b.id;
        activeOfficialSignModalStep = step;
        const isStep10 = step === '10';

        const defaultName = isStep10
            ? (td.assetOfficerName || (currentAdminUser ? currentAdminUser.name : 'Pegawai Aset / Kenderaan'))
            : (td.headDeptName || (currentAdminUser ? currentAdminUser.name : 'Pengetua SMKA Maahad Muar'));

        const defaultStamp = isStep10
            ? (td.assetOfficerStamp || 'Pegawai Aset / Kenderaan SMKA Maahad Muar')
            : (td.headDeptStamp || 'Pengetua SMKA Maahad Muar');

        const currentDecision = presetDecision || (isStep10 ? (td.assetOfficerStatus || 'approved') : (td.headDeptStatus || 'approved'));
        officialSignCanvasDataUrl = isStep10 ? (td.assetOfficerSignature || '') : (td.headDeptSignature || '');

        showModal(
            isStep10 ? '10. Sokongan & Pengesahan Pegawai Aset / Kenderaan' : '11. Kelulusan Ketua Jabatan',
            `<div class="space-y-3 text-left text-xs">
                <div class="p-2.5 rounded-xl bg-muji-bg border border-muji-border">
                    <div class="font-bold text-muji-text">${b.teacherName} — Destinasi: ${td.destination || b.purpose}</div>
                    <div class="text-[11px] text-muji-muted">Tarikh: ${b.date} • No. Siri: ${td.refNo || '-'}</div>
                </div>
                <div>
                    <label class="block font-bold text-muji-text mb-1">Status Keputusan:</label>
                    <select id="official-sign-decision" class="w-full p-2.5 rounded-xl input-3d font-bold text-muji-text">
                        <option value="approved" ${currentDecision === 'approved' ? 'selected' : ''}>✅ ${isStep10 ? 'SOKONG & SAHKAN (Hantar ke Dashboard No. 11)' : 'DILULUSKAN (Ketua Jabatan)'}</option>
                        <option value="rejected" ${currentDecision === 'rejected' ? 'selected' : ''}>❌ ${isStep10 ? 'TIDAK DISOKONG (Tidak dihantar ke No. 11)' : 'TIDAK DILULUSKAN'}</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-muji-text mb-1">Nama Penandatangan</label>
                        <input type="text" id="official-signer-name" value="${defaultName}" class="w-full p-2.5 rounded-xl input-3d">
                    </div>
                    <div>
                        <label class="block font-semibold text-muji-text mb-1">Jawatan / Cop Rasmi</label>
                        <input type="text" id="official-signer-stamp" value="${defaultStamp}" class="w-full p-2.5 rounded-xl input-3d">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-muji-text"><i class="fas fa-pen-nib mr-1 text-muji-accent"></i>Lukis Tandatangan Digital (Wajib):</label>
                        <button type="button" onclick="clearOfficialSignCanvas()" class="px-2 py-0.5 bg-red-50 text-red-600 rounded text-[10px] font-bold hover:bg-red-100">Padam Sign</button>
                    </div>
                    <div class="bg-white rounded-xl border-2 border-dashed border-muji-accent overflow-hidden">
                        <canvas id="official-sign-canvas" class="w-full h-28 touch-none cursor-crosshair block"></canvas>
                    </div>
                </div>

    function initOfficialSignCanvas() {
        const canvas = document.getElementById('official-sign-canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width || 320;
        canvas.height = rect.height || 112;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (officialSignCanvasDataUrl) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = officialSignCanvasDataUrl;
        }

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
            const cy = e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        };

        const start = (e) => {
            e.preventDefault();
            isDrawingOfficialSign = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        };
        const move = (e) => {
            if (!isDrawingOfficialSign) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            officialSignCanvasDataUrl = canvas.toDataURL('image/png');
        };
        const end = () => {
            if (isDrawingOfficialSign) {
                isDrawingOfficialSign = false;
                officialSignCanvasDataUrl = canvas.toDataURL('image/png');
            }
        };

        canvas.onmousedown = start;
        canvas.onmousemove = move;
        window.addEventListener('mouseup', end);
        canvas.ontouchstart = start;
        canvas.ontouchmove = move;
        canvas.ontouchend = end;
    }

    function clearOfficialSignCanvas() {
        const canvas = document.getElementById('official-sign-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        officialSignCanvasDataUrl = '';
    }

    function saveOfficialDigitalSignature() {
        const b = state.bookings.find(x => Number(x.id) === Number(activeOfficialSignModalBookingId));
        if (!b) return;
        if (!b.transportDetails) b.transportDetails = {};
        const decision = document.getElementById('official-sign-decision')?.value || 'approved';
        const signerName = document.getElementById('official-signer-name')?.value.trim() || '';
        const signerStamp = document.getElementById('official-signer-stamp')?.value.trim() || '';
        const todayStr = formatDateISO(new Date());

        if (!officialSignCanvasDataUrl) {
            setTimeout(() => customAlert('Sila lukis <b>Tandatangan Digital</b> pada ruangan yang disediakan sebelum menyimpan.'), 100);
            return;
        }

        if (activeOfficialSignModalStep === '10') {
            b.transportDetails.assetOfficerStatus = decision;
            b.transportDetails.assetOfficerName = signerName;
            b.transportDetails.assetOfficerStamp = signerStamp;
            b.transportDetails.assetOfficerSignature = officialSignCanvasDataUrl || '';
            b.transportDetails.assetOfficerDate = todayStr;

            // Jika Tidak Disokong pada No. 10, ia tidak akan masuk ke Dashboard No. 11 dan status tempahan ditolak
            if (decision === 'rejected') {
                b.transportDetails.headDeptStatus = '';
                b.transportDetails.headDeptSignature = '';
                b.status = 'rejected';
            } else if (b.status === 'rejected') {
                b.status = 'pending';
            }
        } else if (activeOfficialSignModalStep === '11') {
            if (b.transportDetails.assetOfficerStatus !== 'approved' || !b.transportDetails.assetOfficerSignature) {
                setTimeout(() => customAlert('Permohonan ini belum mendapat sokongan & tandatangan digital daripada Pegawai Aset / Kenderaan (No. 10).'), 100);
                return;
            }
            b.transportDetails.headDeptStatus = decision;
            b.transportDetails.headDeptName = signerName;
            b.transportDetails.headDeptStamp = signerStamp;
            b.transportDetails.headDeptSignature = officialSignCanvasDataUrl || '';
            b.transportDetails.headDeptDate = todayStr;
            b.status = decision === 'approved' ? 'approved' : 'rejected';
            b.updatedAt = Date.now();
        }

        saveState();
        pushBookingStatusToSheet(b);
        showAdminTab(currentAdminTab);

        if (activeOfficialSignModalStep === '10') {
            if (decision === 'approved') {
                customAlert('Sokongan & Tandatangan Digital <b>No. 10 (Pegawai Aset / Kenderaan)</b> telah disimpan! Permohonan ini kini telah dihantar ke <b>Dashboard Penandatangan Digital — 11. Kelulusan Ketua Jabatan</b>.');
            } else {
                customAlert('Permohonan ditandakan sebagai <b>Tidak Disokong</b> pada No. 10 dan tidak akan dihantar ke Dashboard No. 11.');
            }
        } else {
            customAlert(`Kelulusan & Tandatangan Digital <b>No. 11 (Ketua Jabatan)</b> telah berjaya disimpan ke dalam Borang PDF!`);
        }
    }

    function toggleAdminItemDisabled(key, id) {
        const item = state[key].find(i => Number(i.id) === Number(id));
        if (!item) return;
        item.disabled = !item.disabled;
        saveState();
        showAdminTab(key);
        customAlert(`Status <b>${item.name}</b> kini telah ditukar kepada: <b>${item.disabled ? 'DISABLED (Ditutup Sementara)' : 'ENABLED (Dibuka Semula)'}</b>.`);
    }

    function toggleCustomDisableTimeRange(key, id) {
        const sel = document.getElementById(`disable-time-input-${key}-${id}`);
        const box = document.getElementById(`disable-custom-time-box-${key}-${id}`);
        if (!sel || !box) return;
        if (sel.value === 'custom') {
            box.classList.remove('hidden');
        } else {
            box.classList.add('hidden');
        }
    }

    function addDisabledDateToItem(key, id) {
        const item = state[key].find(i => Number(i.id) === Number(id));
        if (!item) return;
        const dateEl = document.getElementById(`disable-date-input-${key}-${id}`);
        const timeEl = document.getElementById(`disable-time-input-${key}-${id}`);
        const reasonEl = document.getElementById(`disable-reason-input-${key}-${id}`);

        const dateVal = dateEl ? dateEl.value : '';
        const timeScope = timeEl ? timeEl.value : 'all';
        const reasonVal = (reasonEl && reasonEl.value.trim()) ? reasonEl.value.trim() : 'Digunakan oleh pihak sekolah';

        if (!dateVal) {
            customAlert('Sila pilih tarikh yang ingin di-disabled-kan terlebih dahulu.');
            return;
        }

        let timeLabel = 'Sepanjang Hari';
        if (timeScope === 'custom') {
            const startVal = document.getElementById(`disable-custom-start-${key}-${id}`)?.value || '';
            const endVal = document.getElementById(`disable-custom-end-${key}-${id}`)?.value || '';
            if (!startVal || !endVal) {
                customAlert('Sila pilih Masa Mula dan Masa Tamat bagi pilihan Masa Tersuai.');
                return;
            }
            timeLabel = `${formatTime12Hour(startVal)} - ${formatTime12Hour(endVal)}`;
        } else if (timeScope !== 'all') {
            const foundSlot = (state.timeSlots || []).find(s => s.id === timeScope);
            timeLabel = foundSlot ? foundSlot.time : timeScope;
        }

        if (!Array.isArray(item.disabledDates)) item.disabledDates = [];
        const exists = item.disabledDates.some(d => {
            if (typeof d === 'string') return d === dateVal && timeScope === 'all';
            return d.date === dateVal && (d.timeScope || 'all') === timeScope && (d.timeLabel || 'Sepanjang Hari') === timeLabel;
        });
        if (exists) {
            customAlert(`Tarikh <b>${dateVal}</b> (${timeLabel}) sudah berada dalam senarai yang ditutup.`);
            return;
        }
        item.disabledDates.push({
            date: dateVal,
            timeScope: timeScope,
            timeLabel: timeLabel,
            reason: reasonVal
        });
        saveState();
        showAdminTab(key);
        customAlert(`Tarikh <b>${dateVal}</b> • Masa: <b>${timeLabel}</b> bagi <b>${item.name}</b> telah berjaya di-disabled-kan (${reasonVal}).`);
    }

    function removeDisabledDateFromItem(key, id, dateIdx) {
        const item = state[key].find(i => Number(i.id) === Number(id));
        if (!item || !Array.isArray(item.disabledDates)) return;
        item.disabledDates.splice(dateIdx, 1);
        saveState();
        showAdminTab(key);
    }

    function addAdminItem(key) {
        const name = document.getElementById('new-item-name').value.trim();
        const img = document.getElementById('new-item-img').value.trim() || `https://placehold.co/400x300/8B7864/ffffff?text=${encodeURIComponent(name || 'Fasiliti')}`;
        const desc = document.getElementById('new-item-desc').value.trim() || 'Tersedia untuk tempahan warga sekolah.';
        if (!name) {
            customAlert('Sila masukkan nama item.');
            return;
        }
        state[key].push({
            id: Date.now(),
            name,
            img,
            desc,
            icons: JSON.parse(JSON.stringify(newFormSelectedIcons))
        });
        newFormSelectedIcons = [];
        saveState();
        showAdminTab(key);
    }

    function startEditAdminItem(key, id) {
        const item = state[key].find(i => Number(i.id) === Number(id));
        if (!item) return;
        editingFacilityKey = `${key}_${id}`;
        editFormSelectedIcons = JSON.parse(JSON.stringify(item.icons || []));
        showAdminTab(key);
    }

    function cancelEditAdminItem() {
        const currentKey = editingFacilityKey ? editingFacilityKey.split('_')[0] : 'facilities';
        editingFacilityKey = null;
        editFormSelectedIcons = [];
        showAdminTab(currentKey);
    }

    function saveEditAdminItem(key, id) {
        const item = state[key].find(i => Number(i.id) === Number(id));
        if (!item) return;
        const newName = document.getElementById(`edit-item-name-${id}`)?.value.trim();
        const newImg = document.getElementById(`edit-item-img-${id}`)?.value.trim();
        const newDesc = document.getElementById(`edit-item-desc-${id}`)?.value.trim();
        if (!newName) return;
        item.name = newName;
        item.img = newImg || item.img;
        item.desc = newDesc || '';
        item.icons = JSON.parse(JSON.stringify(editFormSelectedIcons));
        editingFacilityKey = null;
        editFormSelectedIcons = [];
        saveState();
        showAdminTab(key);
    }

    function duplicateAdminItem(key, id) {
        const item = state[key].find(i => Number(i.id) === Number(id));
        if (!item) return;
        state[key].push({
            id: Date.now(),
            name: `${item.name} (Salinan)`,
            img: item.img,
            desc: item.desc,
            icons: JSON.parse(JSON.stringify(item.icons || []))
        });
        saveState();
        showAdminTab(key);
    }

    function deleteAdminItem(key, id) {
        customConfirm('Padam item ini daripada senarai?', () => {
            state[key] = state[key].filter(i => Number(i.id) !== Number(id));
            saveState();
            showAdminTab(key);
        });
    }

    function getFilteredBookingsForAdminCleanup() {
        return state.bookings.filter(b => {
            const bDate = normalizeDateToISO(b.date);
            if (adminDeleteDateFrom && bDate < adminDeleteDateFrom) return false;
            if (adminDeleteDateTo && bDate > adminDeleteDateTo) return false;
            return true;
        });
    }

            .map((a, idx) => ({ ...a, _origIdx: idx }))

        container.innerHTML = `

                        <p class="text-[11px] text-muji-muted">Cipta ID dan Kata Laluan untuk Admin setiap Fasiliti, setiap Kenderaan, atau Admin Utama. Setiap fasiliti dan kenderaan mempunyai dashboard sendiri untuk meluluskan, menolak, mengedit dan memadam tempahan.</p>

                                            ${renderAdminRoleOptionsHtml(a.role || 'super')}

                <!-- BAHAGIAN 2: DAFTAR AKAUN 2 DASHBOARD PENANDATANGAN DIGITAL KHUSUS (NO. 10 & NO. 11) -->

                    <div class="flex flex-wrap justify-between items-start gap-2 border-b border-muji-border pb-3">
                        <div>
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-teal-600 text-white">KHUSUS BORANG KENDERAAN BERSAMA PEMANDU</span>
                            <h3 class="font-bold text-base text-muji-text mt-1">
                                <i class="fas fa-file-signature mr-1.5 text-teal-700"></i>Daftar Akaun 2 Dashboard Penandatangan Digital (No. 10 & No. 11)
                            </h3>
                            <p class="text-xs text-muji-muted">Admin Utama boleh mencipta ID Pengguna & Kata Laluan di bawah supaya Pegawai Aset / Kenderaan (No. 10) dan Ketua Jabatan (No. 11) dapat log masuk ke dashboard penandatangan masing-masing.</p>

                    </div>

                            <h4 class="font-bold text-xs text-muji-text flex items-center gap-1.5">
                                <i class="fas fa-key text-teal-600"></i> Cipta ID & Kata Laluan Penandatangan Digital
                            </h4>
                            <div class="space-y-2.5 text-xs">
                                <div>
                                    <label class="block text-[11px] font-semibold text-muji-text mb-1">Pilih Kategori Dashboard Penandatangan Digital</label>

                                        <option value="signer11">🏛️ Dashboard 2 — No. 11: Kelulusan Ketua Jabatan (Diluluskan / Tidak Diluluskan)</option>

                                <div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

                                        <input type="text" id="new-signer-id" placeholder="Cth: pegawai_aset / pengetua" class="w-full p-3 rounded-xl input-3d">

                                    <div>
                                        <label class="block text-[11px] font-semibold text-muji-text mb-1">Kata Laluan</label>

                        <!-- Senarai Akaun 2 Dashboard Penandatangan Digital Sedia Ada -->
                        <div class="bg-white p-4 rounded-2xl border border-muji-border space-y-2.5">
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-xs text-muji-text">Senarai Akaun 2 Dashboard Penandatangan Digital</h4>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-muji-bg border border-muji-border text-muji-muted">${signerAdmins.length} Akaun</span>
                            </div>
                            ${signerAdmins.length === 0 ? `
                                <div class="p-5 rounded-xl bg-muji-bg border border-dashed border-muji-border text-center text-xs text-muji-muted">
                                    Tiada akaun penandatangan digital didaftarkan lagi. Sila cipta ID dan Kata Laluan pada borang di sebelah kiri.

                                return `

                                        <div class="space-y-0.5">
                                            <div class="flex items-center gap-1.5 flex-wrap">

                                            </div>
                                            <p class="text-[11px] text-muji-text">
                                                ID Log Masuk: <b class="font-mono text-teal-900">${a.id}</b> • Kata Laluan: <b class="font-mono text-purple-900">${a.pass}</b>
                                            </p>
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            <select onchange="changeAdminUserRole(${a._origIdx}, this.value)" class="p-1.5 rounded-lg bg-white border border-muji-border text-[10px] font-semibold">
                                                <option value="signer10" ${a.role === 'signer10' ? 'selected' : ''}>No. 10 Pegawai Aset</option>
                                                <option value="signer11" ${a.role === 'signer11' ? 'selected' : ''}>No. 11 Ketua Jabatan</option>
                                            </select>
                                            <button onclick="removeAdminUser(${a._origIdx})" class="px-2.5 py-1 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 text-[10px] font-bold">
                                                <i class="fas fa-trash-alt mr-0.5"></i> Padam
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>

                <!-- PENGURUSAN & PEMADAMAN REKOD TEMPAHAN -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-muji-border space-y-4">
                    <div class="flex flex-wrap justify-between items-center gap-2 border-b border-muji-border pb-3">
                        <div>
                            <h3 class="font-bold text-base text-muji-text"><i class="fas fa-database mr-1.5 text-muji-danger"></i>Pengurusan & Pemadaman Rekod Tempahan</h3>
                            <p class="text-xs text-muji-muted">Padam rekod mengikut status, reset keseluruhan jadual, atau tapis mengikut julat tarikh.</p>
                        </div>
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-muji-bg border border-muji-border text-muji-text">Jumlah Semasa: ${state.bookings.length} rekod</span>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
                        <button onclick="deleteBookingsByStatus('pending')" class="p-3 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 text-xs font-bold flex flex-col items-center justify-center gap-1 transition-all">
                            <i class="fas fa-hourglass-half text-base"></i>
                            <span>Padam Data Menunggu</span>
                            <span class="text-[10px] font-normal">(${pendingCount} rekod)</span>
                        </button>
                        <button onclick="deleteBookingsByStatus('approved')" class="p-3 rounded-xl bg-green-50 hover:bg-green-100 border border-green-200 text-green-800 text-xs font-bold flex flex-col items-center justify-center gap-1 transition-all">
                            <i class="fas fa-check-circle text-base"></i>
                            <span>Padam Data Lulus</span>
                            <span class="text-[10px] font-normal">(${approvedCount} rekod)</span>
                        </button>
                        <button onclick="deleteBookingsByStatus('rejected')" class="p-3 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-800 text-xs font-bold flex flex-col items-center justify-center gap-1 transition-all">
                            <i class="fas fa-times-circle text-base"></i>
                            <span>Padam Tolak & Batal</span>
                            <span class="text-[10px] font-normal">(${rejectedCount} rekod)</span>
                        </button>
                        <button onclick="deleteAllBookingsRecord()" class="p-3 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold flex flex-col items-center justify-center gap-1 shadow-sm transition-all">
                            <i class="fas fa-trash-alt text-base"></i>
                            <span>Padam Semua Rekod</span>
                            <span class="text-[10px] font-normal opacity-90">Kosongkan Jadual</span>
                        </button>
                        <button onclick="resetBookingsRecord()" class="p-3 rounded-xl bg-gray-800 hover:bg-black text-white text-xs font-bold flex flex-col items-center justify-center gap-1 shadow-sm transition-all col-span-2 sm:col-span-1">
                            <i class="fas fa-redo-alt text-base"></i>
                            <span>Reset Rekod Tempahan</span>
                            <span class="text-[10px] font-normal opacity-90">Set Semula Sistem</span>
                        </button>
                    </div>

                    <!-- PENAPIS TARIKH HINGGA TARIKH UNTUK PEMADAMAN REKOD -->
                    <div class="p-4 rounded-2xl bg-muji-bg border border-muji-border space-y-3">
                        <div class="flex flex-wrap justify-between items-center gap-2">
                            <div>
                                <h4 class="font-bold text-xs text-muji-text flex items-center gap-1.5">
                                    <i class="fas fa-calendar-alt text-muji-danger"></i>
                                    Filter Tarikh Hingga Tarikh Untuk Dipadam
                                </h4>
                                <p class="text-[11px] text-muji-muted">Pilih julat tarikh mula hingga tarikh akhir untuk menapis dan memadam rekod tempahan.</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-full bg-white border border-muji-border text-[11px] font-bold text-muji-text">
                                Ditemui: <b class="text-muji-danger">${filteredList.length}</b> rekod dalam julat tarikh
                            </span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-end text-xs">
                            <div class="sm:col-span-4">
                                <label class="block text-[10px] font-bold text-muji-muted mb-1">Dari Tarikh (Mula)</label>
                                <input type="date" id="admin-del-date-from" value="${adminDeleteDateFrom}" onchange="updateAdminDeleteDateFilter()" class="w-full p-2.5 rounded-xl bg-white border border-muji-border text-xs font-semibold cursor-pointer">
                            </div>
                            <div class="sm:col-span-4">
                                <label class="block text-[10px] font-bold text-muji-muted mb-1">Hingga Tarikh (Akhir)</label>
                                <input type="date" id="admin-del-date-to" value="${adminDeleteDateTo}" onchange="updateAdminDeleteDateFilter()" class="w-full p-2.5 rounded-xl bg-white border border-muji-border text-xs font-semibold cursor-pointer">
                            </div>
                            <div class="sm:col-span-4 flex gap-1.5">
                                <button type="button" onclick="clearAdminDeleteDateFilter()" class="px-3 py-2.5 bg-white border border-muji-border text-muji-text rounded-xl text-xs font-semibold hover:bg-gray-100 shrink-0" title="Reset Filter Tarikh">
                                    <i class="fas fa-undo mr-1"></i>Reset Tarikh
                                </button>
                                <button type="button" onclick="deleteBookingsInDateRange()" class="flex-1 py-2.5 px-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow-sm flex items-center justify-center gap-1.5 transition-colors">
                                    <i class="fas fa-trash-alt"></i> Padam Mengikut Julat Tarikh (${filteredList.length})
                                </button>
                            </div>
                        </div>

                        <!-- Senarai Rekod Hasil Tapisan Tarikh -->
                        <div class="bg-white rounded-xl border border-muji-border overflow-hidden">
                            <div class="p-2.5 bg-gray-50 border-b border-muji-border flex flex-wrap justify-between items-center gap-2 text-[11px]">
                                <label class="inline-flex items-center gap-2 font-bold text-muji-text cursor-pointer">
                                    <input type="checkbox" onchange="toggleSelectAllFilteredToDelete(this.checked)" ${filteredList.length > 0 && filteredList.every(b => selectedBookingsToDelete.has(Number(b.id))) ? 'checked' : ''} class="w-4 h-4 accent-red-600">
                                    <span>Pilih Semua Dalam Senarai Tapisan (${filteredList.length} rekod)</span>
                                </label>
                                <div class="flex items-center gap-2">
                                    ${selectedBookingsToDelete.size > 0 ? `
                                        <button type="button" onclick="deleteSelectedBookingsFromCleanup()" class="px-3 py-1 bg-red-600 text-white rounded-lg text-[10px] font-bold hover:bg-red-700 shadow-sm">
                                            <i class="fas fa-trash mr-1"></i>Padam Rekod Ditanda (${selectedBookingsToDelete.size})
                                        </button>
                                    ` : ''}
                                    <span class="text-[10px] text-muji-muted"><i class="fas fa-arrows-alt-v mr-1"></i>Scroll</span>
                                </div>
                            </div>
                            <div class="max-h-60 overflow-y-auto divide-y divide-muji-border text-xs">
                                ${filteredList.length === 0 ? `
                                    <div class="p-5 text-center text-muji-muted text-xs">
                                        Tiada rekod tempahan ditemui bagi julat tarikh yang dipilih.
                                    </div>
                                ` : filteredList.map(b => {
                                    const itemsList = b.type === 'facility' ? state.facilities : state.transports;
                                    const item = itemsList.find(i => Number(i.id) === Number(b.itemId));
                                    const itemName = item ? item.name : (b.itemName || 'Fasiliti/Kenderaan');
                                    const isChecked = selectedBookingsToDelete.has(Number(b.id));
                                    return `
                                        <div class="p-2.5 flex items-center justify-between gap-2 hover:bg-red-50/30 transition-colors">
                                            <label class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer">
                                                <input type="checkbox" onchange="toggleSingleBookingToDelete(${b.id}, this.checked)" ${isChecked ? 'checked' : ''} class="w-4 h-4 accent-red-600 shrink-0">
                                                <div class="min-w-0 flex-1">
                                                    <div class="flex items-center gap-1.5 flex-wrap">
                                                        <span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase ${b.type === 'facility' ? 'bg-amber-100 text-amber-900' : 'bg-blue-100 text-blue-900'}">${b.type === 'facility' ? 'Fasiliti' : 'Kenderaan'}</span>
                                                        <span class="font-bold text-muji-text truncate">${itemName}</span>
                                                        <span class="text-[10px] font-bold text-muji-accent">• ${b.date}</span>
                                                    </div>
                                                    <div class="text-[11px] text-muji-muted truncate">
                                                        ${b.teacherName} (${b.form} - ${b.className}) • ${b.purpose}
                                                    </div>
                                                </div>
                                            </label>
                                            <button type="button" onclick="deleteSingleBookingFromCleanup(${b.id})" class="px-2.5 py-1 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 text-[10px] font-bold shrink-0">
                                                <i class="fas fa-trash-alt"></i> Padam
                                            </button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function updateAdminDeleteDateFilter() {
        const fromEl = document.getElementById('admin-del-date-from');
        const toEl = document.getElementById('admin-del-date-to');
        adminDeleteDateFrom = fromEl ? fromEl.value : '';
        adminDeleteDateTo = toEl ? toEl.value : '';
        selectedBookingsToDelete.clear();
        showAdminTab('admins');
    }

    function clearAdminDeleteDateFilter() {
        adminDeleteDateFrom = '';
        adminDeleteDateTo = '';
        selectedBookingsToDelete.clear();
        showAdminTab('admins');
    }

    function toggleSelectAllFilteredToDelete(isChecked) {
        const filtered = getFilteredBookingsForAdminCleanup();
        if (isChecked) {
            filtered.forEach(b => selectedBookingsToDelete.add(Number(b.id)));
        } else {
            filtered.forEach(b => selectedBookingsToDelete.delete(Number(b.id)));
        }
        showAdminTab('admins');
    }

    function toggleSingleBookingToDelete(bookingId, isChecked) {
        const numId = Number(bookingId);
        if (isChecked) selectedBookingsToDelete.add(numId);
        else selectedBookingsToDelete.delete(numId);
        showAdminTab('admins');
    }

    function deleteSingleBookingFromCleanup(bookingId) {
        customConfirm('Adakah anda pasti mahu memadam rekod tempahan ini?', () => {
            const numId = Number(bookingId);
            state.bookings = state.bookings.filter(b => Number(b.id) !== numId);
            selectedBookingsToDelete.delete(numId);
            saveState();
            pushDeleteBookingsToSheet('ids', [numId]);
            showAdminTab('admins');
        });
    }

    function deleteSelectedBookingsFromCleanup() {
        const idsToDelete = Array.from(selectedBookingsToDelete);
        if (idsToDelete.length === 0) {
            customAlert('Sila tandakan sekurang-kurangnya satu rekod tempahan untuk dipadam.');
            return;
        }
        customConfirm(`Adakah anda pasti mahu memadam <b>${idsToDelete.length} rekod tempahan</b> yang telah ditandakan?`, () => {
            const idSet = new Set(idsToDelete.map(Number));
            state.bookings = state.bookings.filter(b => !idSet.has(Number(b.id)));
            selectedBookingsToDelete.clear();
            saveState();
            pushDeleteBookingsToSheet('ids', idsToDelete);
            showAdminTab('admins');
            customAlert(`Berjaya memadam <b>${idsToDelete.length} rekod tempahan</b>!`);
        });
    }

    function deleteBookingsInDateRange() {
        if (!adminDeleteDateFrom && !adminDeleteDateTo) {
            customAlert('Sila pilih <b>Dari Tarikh (Mula)</b> atau <b>Hingga Tarikh (Akhir)</b> terlebih dahulu sebelum memadam mengikut julat tarikh.');
            return;
        }
        const matched = getFilteredBookingsForAdminCleanup();
        if (matched.length === 0) {
            customAlert('Tiada rekod tempahan dalam julat tarikh yang dipilih untuk dipadam.');
            return;
        }
        const rangeLabel = `${adminDeleteDateFrom || 'Awal'} hingga ${adminDeleteDateTo || 'Akhir'}`;
        customConfirm(`Adakah anda pasti mahu memadam kesemua <b>${matched.length} rekod tempahan</b> bagi julat tarikh <b>${rangeLabel}</b>?`, () => {
            const idsToDelete = matched.map(b => Number(b.id));
            const idSet = new Set(idsToDelete);
            state.bookings = state.bookings.filter(b => !idSet.has(Number(b.id)));
            selectedBookingsToDelete.clear();
            saveState();
            pushDeleteBookingsToSheet('ids', idsToDelete);
            showAdminTab('admins');
            customAlert(`Berjaya memadam <b>${idsToDelete.length} rekod tempahan</b> dalam julat tarikh <b>${rangeLabel}</b>!`);
        });
    }

    function deleteBookingsByStatus(statusType) {
        const count = state.bookings.filter(b => b.status === statusType).length;
        if (count === 0) {
            customAlert('Tiada rekod tempahan bagi status tersebut.');
            return;
        }
        customConfirm(`Adakah anda pasti mahu memadam kesemua <b>${count} rekod</b> ini?`, () => {
            state.bookings = state.bookings.filter(b => b.status !== statusType);
            saveState();
            pushDeleteBookingsToSheet('status', [], statusType);
            showAdminTab('admins');
        });
    }

    function deleteAllBookingsRecord() {
        if (state.bookings.length === 0) {
            customAlert('Tiada rekod tempahan untuk dipadamkan.');
            return;
        }
        customConfirm(`Padam <b>KESEMUA ${state.bookings.length} rekod tempahan</b>?`, () => {
            state.bookings = [];
            saveState();
            pushDeleteBookingsToSheet('all');
            showAdminTab('admins');
        });
    }

    function resetBookingsRecord() {
        customConfirm('Adakah anda pasti mahu melakukan <b>Reset Rekod Tempahan</b>?', () => {
            state.bookings = [];
            saveState();
            pushDeleteBookingsToSheet('all');
            showAdminTab('admins');
        });
    }

    function addAdminUser() {
        const name = document.getElementById('new-admin-name')?.value.trim();
        const id = document.getElementById('new-admin-id')?.value.trim();
        const pass = document.getElementById('new-admin-pass')?.value.trim();
        const role = document.getElementById('new-admin-role')?.value || 'facility';
        if (!id || !pass) {
            customAlert('Sila masukkan ID Pengguna dan Kata Laluan.');
            return;
        }
        if (state.admins.some(a => a.id === id)) {
            customAlert('ID Pengguna ini telah wujud.');
            return;
        }
        state.admins.push({ id, pass, role, name: name || id });
        saveState();
        showAdminTab('admins');
    }

    function addDigitalSignerUser() {
        const role = document.getElementById('new-signer-role')?.value || 'signer10';
        const name = document.getElementById('new-signer-name')?.value.trim();
        const id = document.getElementById('new-signer-id')?.value.trim();
        const pass = document.getElementById('new-signer-pass')?.value.trim();
        if (!id || !pass) {

    function saveWaCancelAdminFromSettings() {
        const name = document.getElementById('wa-cancel-admin-name')?.value.trim() || '';
        let phone = document.getElementById('wa-cancel-admin-phone')?.value.trim() || '';
        if (!name || !phone) {
            customAlert('Sila lengkapkan Nama Penerima dan No. Telefon WhatsApp.');
            return;
        }
        phone = phone.replace(/[^0-9]/g, '');
        if (phone.startsWith('0')) phone = '6' + phone;

        const facIds = Array.from(newWaAdminSelectedFacilities);
        const transIds = Array.from(newWaAdminSelectedTransports);
        if (facIds.length === 0 && transIds.length === 0) {
            customAlert('Sila tandakan sekurang-kurangnya satu item di bawah kategori <b>Tetapan Fasiliti & Bilik Khas</b> atau <b>Tetapan Kenderaan Sekolah</b>.');
            return;
        }

        if (!Array.isArray(state.whatsappCancelAdmins)) state.whatsappCancelAdmins = [];

        if (editingWaAdminId) {
            const existing = state.whatsappCancelAdmins.find(a => Number(a.id) === Number(editingWaAdminId));
            if (existing) {
                existing.name = name;
                existing.phone = phone;
                existing.facilityIds = facIds;
                existing.transportIds = transIds;
            }
            editingWaAdminId = null;
        } else {
            state.whatsappCancelAdmins.push({
                id: Date.now(),
                name,
                phone,
                facilityIds: facIds,
                transportIds: transIds
            });
        }

        // Kemas kini juga nombor telefon utama lalai jika ada penerima pertama
        if (state.whatsappCancelAdmins.length > 0) {
            state.adminSettings.adminPhone = state.whatsappCancelAdmins[0].phone;
        }

        newWaAdminSelectedFacilities.clear();
        newWaAdminSelectedTransports.clear();
        saveState();
        showAdminTab('settings');
        customAlert(`Maklumat penerima mesej pembatalan WhatsApp (<b>${name} - ${phone}</b>) berjaya disimpan!`);
    }

        editingWaAdminId = adm.id;

    function deleteWaCancelAdmin(id) {
        const adm = (state.whatsappCancelAdmins || []).find(a => Number(a.id) === Number(id));
        const label = adm ? `${adm.name} (${adm.phone})` : 'penerima ini';

    function exportToExcel() {
        try {
            const data = state.bookings.map((b, i) => {
                const itemsList = b.type === 'facility' ? state.facilities : state.transports;
                const item = itemsList.find(x => Number(x.id) === Number(b.itemId));
                return {
                    'Bil': i + 1,
                    'Tarikh': b.date,
                    'Kategori': b.type === 'facility' ? 'Fasiliti' : 'Kenderaan',
                    'Nama Fasiliti / Kenderaan': item ? item.name : (b.itemName || '-'),
                    'Nama Guru': b.teacherName,
                    'Tingkatan': b.form,
                    'Kelas': b.className,
                    'Subjek / Unit': b.subject,
                    'Tujuan': b.purpose,
                    'Slot Masa': formatSlotDisplay(b),
                    'No. Telefon': b.phone,
                    'Status': b.status
                };
            });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Tempahan");
            XLSX.writeFile(wb, "Laporan_Tempahan_SMKA_Maahad_Muar.xlsx");
        } catch (err) {
            customAlert('Gagal mengeksport Excel: ' + err.message);
        }
    }

                try { doc.addImage(td.assetOfficerSignature, 'PNG', 121, y + 1.2, 36, 10); } catch (e) {}
            }

            y += 11.5;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.2);
            doc.text('Tandatangan : ...........................................................', 22, y);
            doc.text('Tandatangan : ...........................................................', 98, y);

            // Baris 2: Nama
            y += 4.5;
            doc.text(`Nama            : ${String(b.teacherName || '').toUpperCase().substring(0, 32)}`, 22, y);
            doc.text(`Nama            : ${td.assetOfficerName ? String(td.assetOfficerName).toUpperCase().substring(0, 32) : '...........................................................'}`, 98, y);

            // Baris 3: Jawatan
            y += 4.5;
            doc.text(`Jawatan         : ${String(td.applicantPosition || 'Guru / Staf').substring(0, 32)}`, 22, y);
            doc.text(`Jawatan         : ${td.assetOfficerStamp ? String(td.assetOfficerStamp).substring(0, 32) : 'Pegawai Aset / Kenderaan'}`, 98, y);

            // Baris 4: Tarikh & No. Telefon
            y += 4.5;
            doc.text(`Tarikh / Tel    : ${b.date} (${b.phone || '-'})`, 22, y);
            doc.text(`Tarikh           : ${td.assetOfficerDate || (td.assetOfficerStatus ? b.date : '...........................................................')}`, 98, y);

            // BAHAGIAN 11: KELULUSAN KETUA JABATAN - DISUSUN SELARI (BARIS 1: SIGN, BARIS 2: NAMA, BARIS 3: JAWATAN)
            y += 4.5;
            doc.setLineWidth(0.35);
            doc.rect(20, y, 172, 28);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.8);
            const headDecisionLabel = td.headDeptStatus === 'approved'
                ? 'DILULUSKAN'
                : (td.headDeptStatus === 'rejected' ? 'TIDAK DILULUSKAN' : 'DILULUSKAN / TIDAK DILULUSKAN');
            doc.text(`11. Kelulusan Ketua Jabatan :   ${headDecisionLabel}`, 22, y + 5);

            // Baris 1: Tandatangan Ketua Jabatan
            if (td.headDeptSignature) {
                try { doc.addImage(td.headDeptSignature, 'PNG', 45, y + 5.8, 36, 10); } catch (e) {}
            }
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.2);
            doc.text('Tandatangan : ...........................................................', 22, y + 15.5);

            // Baris 2: Nama Ketua Jabatan
            doc.text(`Nama            : ${td.headDeptName ? String(td.headDeptName).toUpperCase().substring(0, 45) : '...........................................................'}`, 22, y + 20.5);

            // Baris 3: Jawatan Ketua Jabatan & Tarikh
            doc.text(`Jawatan         : ${td.headDeptStamp ? String(td.headDeptStamp).substring(0, 45) : 'Pengetua / Ketua Jabatan SMKA Maahad Muar'}`, 22, y + 25.5);
            doc.text(`Tarikh : ${td.headDeptDate || (td.headDeptStatus ? b.date : '.........................')}`, 140, y + 25.5);

            y += 33;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.text('UNTUK KEGUNAAN PEJABAT', 20, y);

            const assignedVeh = td.assignedVehicle || '';
            const assignedDrv = td.assignedDriver || '';
            const officeVehiclesList = state.officeVehicles || [];
            const officeDriversList = state.officeDrivers || [];

            y += 5;
            doc.setFont('helvetica', 'normal');
            doc.text('12. No Kenderaan :', 20, y);
            officeVehiclesList.forEach((v, idx) => {
                if (idx > 0) y += 5;
                doc.text(`${v.code}   ${v.label}`, 50, y);
                drawCheckBox(doc, 132, y - 3.8, assignedVeh === v.label, 10, 4.5);
            });

            y += 7;
            doc.text('13. Nama Pemandu :', 20, y);
            officeDriversList.forEach((d, idx) => {
                if (idx > 0) y += 5;
                doc.text(`${d.code} ${d.label}`, 50, y);
                drawCheckBox(doc, 142, y - 3.8, assignedDrv === d.label, 10, 4.5);
            });

            doc.setFontSize(7.5);
            doc.text('Kemaskini 11052026', 18, 287);

            // MUKA SURAT 2: LAMPIRAN A
            doc.addPage();
            drawOfficialSchoolHeader(doc, td.refNo || '', true);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.text('SENARAI NAMA PENGGUNA/PENUMPANG KENDERAAN JABATAN', 105, 53, { align: 'center' });

            let ty = 62;
            const colWidths = [12, 68, 36, 36, 30];
            const startX = 14;

            doc.setFillColor(232, 229, 225);
            doc.rect(startX, ty, 182, 8, 'F');
            doc.setLineWidth(0.3);
            let cx = startX;
            const headers = ['Bil.', 'Nama', 'Jawatan', 'No. K/P', 'Jabatan'];
            headers.forEach((h, i) => {
                doc.rect(cx, ty, colWidths[i], 8);
                doc.text(h, cx + (colWidths[i] / 2), ty + 5.3, { align: 'center' });
                cx += colWidths[i];
            });

            ty += 8;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            const paxList = Array.isArray(td.passengers) ? td.passengers : [];
            for (let i = 0; i < 14; i++) {
                const p = paxList[i] || { name: '', position: '', ic: '', department: '' };
                let xPos = startX;
                const rowVals = [String(i + 1), p.name || '', p.position || '', p.ic || '', p.department || ''];
                rowVals.forEach((val, cIdx) => {
                    doc.rect(xPos, ty, colWidths[cIdx], 9);
                    if (cIdx === 0) doc.text(val, xPos + (colWidths[cIdx] / 2), ty + 6, { align: 'center' });
                    else doc.text(String(val).substring(0, 34), xPos + 2, ty + 6);
                    xPos += colWidths[cIdx];
                });
                ty += 9;
            }

            ty += 12;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9.5);
            doc.text('Nama Pegawai Pengiring :', 15, ty);
            doc.setFont('helvetica', 'normal');
            doc.text(String(td.escortName || b.teacherName || '....................................................................................'), 62, ty);

            ty += 6;
            doc.setFont('helvetica', 'bold');
            doc.text('Jawatan                           :', 15, ty);
            doc.setFont('helvetica', 'normal');
            doc.text(String(td.escortPosition || td.applicantPosition || ''), 62, ty);

            ty += 6;
            doc.setFont('helvetica', 'bold');
            doc.text('No. Tel. Bimbit                :', 15, ty);
            doc.setFont('helvetica', 'normal');
            doc.text(String(td.escortPhoneMobile || b.phone || ''), 62, ty);

            ty += 6;
            doc.setFont('helvetica', 'bold');
            doc.text('No. Tel. Pejabat              :', 15, ty);
            doc.setFont('helvetica', 'normal');
            doc.text(String(td.escortPhoneOffice || '06-9521943'), 62, ty);

            doc.setFontSize(7.5);
            doc.text('Kemaskini 11052026', 15, 287);

            doc.save(`Borang_Kenderaan_${b.teacherName.replace(/\s+/g, '_')}_${b.date}.pdf`);
            customAlert('Borang Permohonan Rasmi Kenderaan & Lampiran A (PDF 2 Muka Surat) telah berjaya dijana untuk cetakan dan tandatangan Pengetua!');
        } catch (err) {
            customAlert('Ralat semasa menjana Borang PDF: ' + err.message);
        }
    }

} catch (err) {
            customAlert('Ralat semasa menjana Borang PDF: ' + err.message);
