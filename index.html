    let cachedKpmLogoDataUrl = null;
    function preloadKpmLogo() {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth || 300;
                canvas.height = img.naturalHeight || 200;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                cachedKpmLogoDataUrl = canvas.toDataURL('image/png');
            } catch (e) {}
        };
        img.src = KPM_LOGO_URL + '?t=' + Date.now();
    }

    function setSyncStatus(status, text) {
        const badge = document.getElementById('sync-badge');
        const icon = document.getElementById('sync-icon');
        if (!badge || !icon) return;

        if (status === 'ok') {
            badge.className = 'cursor-pointer absolute top-4 left-4 w-9 h-9 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center hover:scale-105 transition-all shadow-sm';
            icon.className = 'fas fa-table text-emerald-600 text-base';
        } else {
            badge.className = 'cursor-pointer absolute top-4 left-4 w-9 h-9 rounded-full bg-red-50 border border-red-200 flex items-center justify-center hover:scale-105 transition-all shadow-sm';
            icon.className = 'fas fa-table text-red-600 text-base' + (status === 'syncing' ? ' animate-pulse' : '');
        }
        badge.title = text || 'Status Sambungan Sheet';
    }

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerHTML = message;

        actionsContainer.innerHTML = '';
        actions.forEach(action => {
            const btn = document.createElement('button');
            btn.className = `px-4 py-2 rounded-xl text-xs font-semibold transition-colors shadow-sm ${action.class}`;
            btn.innerText = action.text;
            btn.onclick = () => {
                closeModal();
                if (action.onClick) action.onClick();
            };
            actionsContainer.appendChild(btn);
        });
        document.getElementById('custom-modal').classList.remove('hidden');
    }

            return {
                baseRole: 'facility_item',
                itemType: 'facility',
                itemId: itemId,
                itemName: item ? item.name : `Fasiliti #${itemId}`
            };
        }
        if (r.startsWith('transport_item:')) {
            const itemId = Number(r.split(':')[1]);
            const item = (state.transports || []).find(t => Number(t.id) === itemId);
            return {
                baseRole: 'transport_item',
                itemType: 'transport',
                itemId: itemId,
                itemName: item ? item.name : `Kenderaan #${itemId}`
            };
        }
        return { baseRole: r, itemType: null, itemId: null, itemName: null };
    }

    function isItemDisabledOnDate(item, dateStr) {
        if (!item) return { disabled: false, reason: '', partialSlots: [] };
        if (item.disabled === true) {
            return { disabled: true, reason: item.disabledReason || 'Ditutup sementara untuk kegunaan rasmi sekolah.', partialSlots: [] };
        }
        if (dateStr && Array.isArray(item.disabledDates)) {
            const matches = item.disabledDates.filter(d => {
                if (typeof d === 'string') return d === dateStr;
                return d && d.date === dateStr;
            });
            // Jika ada sekatan sepanjang hari (tiada masa spesifik atau slotId = 'all')
            const fullDayBlock = matches.find(d => typeof d === 'string' || !d.timeScope || d.timeScope === 'all');
            if (fullDayBlock) {
                const reason = (typeof fullDayBlock === 'object' && fullDayBlock.reason) ? fullDayBlock.reason : 'Digunakan oleh pihak sekolah (Sepanjang Hari)';
                return { disabled: true, reason: reason, partialSlots: [] };
            }
            if (matches.length > 0) {
                return { disabled: false, reason: '', partialSlots: matches };
            }
        }
        return { disabled: false, reason: '', partialSlots: [] };
    }

    function isSlotDisabledBySchool(item, dateStr, slotObj) {
        if (!item || !dateStr || !slotObj || !Array.isArray(item.disabledDates)) return null;
        const slotRange = parseTimeRangeToMinutes(slotObj.time);
        for (const d of item.disabledDates) {
            if (typeof d !== 'object' || d.date !== dateStr) continue;
            if (!d.timeScope || d.timeScope === 'all') {
                return d.reason || 'Kegunaan Sekolah';
            }
            if (d.timeScope === slotObj.id || d.timeLabel === slotObj.time) {
                return d.reason || 'Kegunaan Sekolah';
            }
            if (d.timeScope === 'custom' && d.timeLabel && slotRange) {
                const blockedRange = parseTimeRangeToMinutes(d.timeLabel);
                if (blockedRange && Math.max(slotRange.startM, blockedRange.startM) < Math.min(slotRange.endM, blockedRange.endM)) {
                    return `${d.reason || 'Kegunaan Sekolah'} (${d.timeLabel})`;
                }
            }
        }
        return null;
    }

    function applyCloudData(res, isBackgroundSync = false) {
        if (!res) return;
        if (res.config) {
            if (res.config.admins) {
                state.admins = res.config.admins;
                ensureSuperAdminCredentials();
            }
            if (Array.isArray(res.config.whatsappCancelAdmins)) {
                state.whatsappCancelAdmins = res.config.whatsappCancelAdmins;
                localStorage.setItem('smka_wa_cancel_admins', JSON.stringify(state.whatsappCancelAdmins));
            }
            if (typeof res.config.announcement === 'string') state.announcement = res.config.announcement;
            if (res.config.facilities && res.config.facilities.length) state.facilities = res.config.facilities;
            if (res.config.transports && res.config.transports.length) state.transports = res.config.transports;
            if (res.config.officeVehicles && res.config.officeVehicles.length) state.officeVehicles = res.config.officeVehicles;
            if (res.config.officeDrivers && res.config.officeDrivers.length) state.officeDrivers = res.config.officeDrivers;
            if (res.config.timeSlots && res.config.timeSlots.length) state.timeSlots = res.config.timeSlots;
            if (res.config.iconLibrary && res.config.iconLibrary.length) state.iconLibrary = res.config.iconLibrary;
            if (res.config.forms && res.config.forms.length) state.forms = normalizeOptionItems(res.config.forms, 'f');
            if (res.config.classes && res.config.classes.length) state.classes = normalizeOptionItems(res.config.classes, 'c');
            if (res.config.adminSettings) state.adminSettings = res.config.adminSettings;
        }
        if (Array.isArray(res.bookings)) {
            state.bookings = res.bookings;
        }
        saveState(true);
        refreshCurrentView(isBackgroundSync);
    }

    async function syncFromGoogleSheet(showNotification = false) {
        const isBackgroundSync = !showNotification;
        setSyncStatus('syncing', 'Menyelaras...');
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((res) => {
                    applyCloudData(res, isBackgroundSync);
                    setSyncStatus('ok', 'Google Sheet Aktif');
                    if (showNotification) customAlert('Data berjaya diselaraskan terus daripada Google Sheet!');
                })
                .withFailureHandler(() => {
                    setSyncStatus('error', 'Ralat Sambungan');
                })
                .getSystemData();
            return;
        }

        const webAppUrl = getWebAppUrl();
        if (webAppUrl) {
            try {
                const resp = await fetch(webAppUrl + (webAppUrl.includes('?') ? '&' : '?') + 'action=getData&t=' + Date.now(), {
                    method: 'GET',
                    redirect: 'follow'
                });
                const json = await resp.json();
                if (json && json.status === 'success') {
                    applyCloudData(json, isBackgroundSync);
                    setSyncStatus('ok', 'Google Sheet Aktif');
                    if (showNotification) customAlert('Data berjaya dimuat turun daripada Google Sheet!');
                    return;
                }
            } catch (e) {}
        }

        // Cuba baca kedua-dua tab 'Booking_Fasiliti' dan 'Booking_Kenderaan' secara langsung supaya tiada rekod tertinggal
        try {
            const bothSheetsBookings = await fetchBothSheetsBookingsDirectly();
            if (Array.isArray(bothSheetsBookings) && bothSheetsBookings.length > 0) {
                state.bookings = bothSheetsBookings;
                saveState(true);
                refreshCurrentView(isBackgroundSync);
                setSyncStatus('ok', 'Google Sheet Aktif (2 Tab)');
                if (showNotification) customAlert(`Data berjaya diselaraskan daripada kedua-dua tab Booking_Fasiliti & Booking_Kenderaan (${bothSheetsBookings.length} rekod)!`);
                return;
            }
        } catch (e) {}

        try {
            const resp = await fetch(CSV_URL + '&t=' + Date.now());
            const csvText = await resp.text();
            const parsedBookings = parseBookingsFromCSV(csvText);
            if (parsedBookings !== null) {
                state.bookings = parsedBookings;
                saveState(true);
                refreshCurrentView(isBackgroundSync);
            }
            setSyncStatus('ok', 'CSV Sheet Aktif');
            if (showNotification) customAlert('Data berjaya dibaca daripada pautan CSV Google Sheet!');
        } catch (err) {
            setSyncStatus('error', 'Mod Luar Talian');
        }
    }

    function fetchSheetTabGvizJsonp(sheetName, defaultType) {
        return new Promise((resolve) => {
            const cbName = 'smkaGvizCb_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
            const script = document.createElement('script');
            const timer = setTimeout(() => {
                cleanup();
                resolve(null);
            }, 6500);

            function cleanup() {
                clearTimeout(timer);
                if (script.parentNode) script.parentNode.removeChild(script);
                try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
            }

            window[cbName] = function(resp) {
                cleanup();
                try {
                    if (!resp || !resp.table || !Array.isArray(resp.table.rows)) {
                        resolve(null);
                        return;
                    }
                    const list = [];
                    resp.table.rows.forEach(rowObj => {
                        const c = rowObj && Array.isArray(rowObj.c) ? rowObj.c : [];
                        const val = (idx) => (c[idx] && c[idx].v !== null && c[idx].v !== undefined) ? c[idx].v : '';
                        const fmt = (idx) => (c[idx] && c[idx].f !== null && c[idx].f !== undefined) ? c[idx].f : val(idx);
                        const rawId = val(0);
                        if (!rawId || String(rawId).toLowerCase() === 'id' || isNaN(Number(rawId))) return;

                        let parsedTransport = null;
                        const rawTd = val(15);
                        if (rawTd) {
                            try { parsedTransport = JSON.parse(String(rawTd)); } catch (e) {}
                        }
                        const rawDate = String(fmt(7) || val(7) || '').replace(/^'/, '').trim();
                        list.push({
                            id: Number(rawId),
                            type: String(val(1) || defaultType || 'facility').trim(),
                            itemId: Number(val(2) || 1),
                            itemName: String(val(3) || ''),
                            teacherName: String(val(4) || ''),
                            form: String(val(5) || ''),
                            className: String(val(6) || ''),
                            date: normalizeDateToISO(rawDate),
                            subject: String(val(8) || ''),
                            purpose: String(val(9) || ''),
                            phone: String(fmt(10) || val(10) || '').replace(/^'/, ''),
                            slotIds: val(11) ? String(val(11)).split(',').map(s => s.trim()).filter(Boolean) : [],
                            customTime: val(12) ? String(val(12)) : null,
                            status: String(val(13) || 'pending').trim().toLowerCase(),
                            timestamp: Number(val(14) || rawId || Date.now()),
                            transportDetails: parsedTransport
                        });
                    });
                    resolve(list);
                } catch (err) {
                    resolve(null);
                }
            };

            script.onerror = () => {
                cleanup();
                resolve(null);
            };
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
            document.body.appendChild(script);
        });
    }

    async function fetchBothSheetsBookingsDirectly() {
        const [facList, transList] = await Promise.all([
            fetchSheetTabGvizJsonp('Booking_Fasiliti', 'facility'),
            fetchSheetTabGvizJsonp('Booking_Kenderaan', 'transport')
        ]);
        if (!Array.isArray(facList) && !Array.isArray(transList)) return null;
        const combined = [...(facList || []), ...(transList || [])];
        combined.sort((a, b) => (Number(b.timestamp) || Number(b.id) || 0) - (Number(a.timestamp) || Number(a.id) || 0));
        return combined;
    }

    function pushSingleBookingToSheet(bookingObj) {
        setSyncStatus('syncing', 'Menghantar...');
        const itemsList = bookingObj.type === 'facility' ? state.facilities : state.transports;
        const found = itemsList.find(i => Number(i.id) === Number(bookingObj.itemId));
        const enriched = Object.assign({}, bookingObj, {
            itemName: found ? found.name : 'Fasiliti/Kenderaan'
        });

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(() => {
                    setSyncStatus('ok', 'Tersimpan di Sheet');
                    pushToGoogleSheet();
                })
                .withFailureHandler(() => setSyncStatus('error', 'Gagal Simpan'))
                .appendSingleBooking(enriched);
            return;
        }

        const webAppUrl = getWebAppUrl();
        if (webAppUrl) {
            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'addBooking', booking: enriched })
            }).then(() => setSyncStatus('ok', 'Tersimpan di Sheet')).catch(() => setSyncStatus('error', 'Ralat Simpan'));
        } else {
            setSyncStatus('ok', 'Simpanan Lokal');
        }
    }

    function parseCSVRows(text) {
        const rows = [];
        let row = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            const next = text[i + 1];
            if (ch === '"' && inQuotes && next === '"') {
                cur += '"';
                i++;
            } else if (ch === '"') {
                inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
                row.push(cur.trim());
                cur = '';
            } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                if (cur !== '' || row.length > 0) {
                    row.push(cur.trim());
                    rows.push(row);
                    row = [];
                    cur = '';
                }
            } else {
                cur += ch;
            }
        }
        if (cur !== '' || row.length > 0) {
            row.push(cur.trim());
            rows.push(row);
        }
        return rows;
    }

    function parseBookingsFromCSV(csvText) {
        const rows = parseCSVRows(csvText);
        if (rows.length === 0) return null;
        const header = rows[0].map(h => h.toLowerCase());
        const isBookingsTable = header.includes('id') && (header.includes('nama guru') || header.includes('tarikh'));
        if (!isBookingsTable) return null;
        if (rows.length === 1) return [];

        const result = [];
        for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r[0] || isNaN(Number(r[0]))) continue;
            let parsedTransport = null;
            if (r[15]) {
                try { parsedTransport = JSON.parse(r[15]); } catch (e) {}
            }
            result.push({
                id: Number(r[0]),
                type: r[1] || 'facility',
                itemId: Number(r[2] || 1),
                itemName: r[3] || '',
                teacherName: r[4] || '',
                form: r[5] || '',
                className: r[6] || '',
                date: (r[7] || '').replace(/^'/, ''),
                subject: r[8] || '',
                purpose: r[9] || '',
                phone: (r[10] || '').replace(/^'/, ''),
                slotIds: r[11] ? r[11].split(',').map(s => s.trim()).filter(Boolean) : [],
                customTime: r[12] || null,
                status: r[13] || 'pending',
                timestamp: Number(r[14] || Date.now()),
                transportDetails: parsedTransport
            });
        }
        return result;
    }

    function updateFrontLiveTicker(forceRender = false) {
        const container = document.getElementById('front-live-ticker-container');
        if (!container) return;

        const now = new Date();
        const todayStr = formatDateISO(now);
        const nowMinutes = now.getHours() * 60 + now.getMinutes();

        // 1. Senarai Slot Masa Semasa (LIVE) yang sedang berlangsung pada waktu ini (jika ada 3 slot terkini, 3 slot akan masuk)
        const activeNowBookings = (state.bookings || []).filter(b => {
            const st = String(b.status || '').trim().toLowerCase();
            if (st !== 'approved' && st !== 'lulus') return false;
            if (normalizeDateToISO(b.date) !== todayStr) return false;
            return isBookingCurrentlyActiveNow(b, nowMinutes).active;
        });

        // 2. Hanya SATU (1) rekod paling terbaru sahaja untuk STATUS TERKINI (sama ada baru berjaya memohon atau baru diluluskan)
        const sortedRecentBookings = [...(state.bookings || [])]
            .filter(b => {
                const st = String(b.status || 'pending').trim().toLowerCase();
                return st !== 'rejected' && st !== 'cancelled' && st !== 'batal' && st !== 'ditolak';
            })
            .sort((a, b) => (Number(b.updatedAt) || Number(b.timestamp) || Number(b.id) || 0) - (Number(a.updatedAt) || Number(a.timestamp) || Number(a.id) || 0));

        const latestBooking = sortedRecentBookings.length > 0 ? sortedRecentBookings[0] : null;

        const currentLiveSig = JSON.stringify(
            activeNowBookings.map(b => {
                const check = isBookingCurrentlyActiveNow(b, nowMinutes);
                return `${b.id}_${check.currentSlotLabel}`;
            })
        );

        const currentStatusSig = latestBooking
            ? `${latestBooking.id}_${latestBooking.status}_${latestBooking.updatedAt || latestBooking.timestamp || ''}_${latestBooking.date}_${latestBooking.teacherName}`
            : 'none';

        const liveChanged = forceRender || currentLiveSig !== lastLiveSlotSignature;
        const statusChanged = forceRender || currentStatusSig !== lastLatestStatusSignature;

        if (!liveChanged && !statusChanged) return;

        // Pastikan rangka bekas wujud
        if (!document.getElementById('front-ticker-box')) {
            container.innerHTML = `
                <div id="front-ticker-box" class="bg-white/95 border border-muji-border rounded-2xl p-2 shadow-sm space-y-1.5">
                    <!-- Baris 1: Tulisan Bergerak Status Slot Masa Semasa (LIVE) - Bergerak Sekali Sahaja -->
                    <div class="flex items-center overflow-hidden bg-emerald-50/70 border border-emerald-200/80 rounded-xl px-2 py-1">
                        <div id="front-ticker-live-badge" class="bg-emerald-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-md mr-2 shrink-0 flex items-center gap-1 shadow-sm z-10">
                            <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span> SLOT LIVE (0)
                        </div>
                        <div id="front-ticker-live-viewport" class="overflow-hidden flex-1 min-w-0 relative"></div>
                    </div>

                    <!-- Baris 2: Tulisan Bergerak 1 Rekod Status Terkini Sahaja - Bergerak Sekali Sahaja -->
                    <div class="flex items-center overflow-hidden bg-muji-bg/80 border border-muji-border rounded-xl px-2 py-1">
                        <div id="front-ticker-status-badge" class="bg-muji-accent text-white text-[9px] font-bold px-2 py-0.5 rounded-md mr-2 shrink-0 flex items-center gap-1 shadow-sm z-10">
                            <i class="fas fa-bell text-[8px]"></i> STATUS TERKINI
                        </div>
                        <div id="front-ticker-status-viewport" class="overflow-hidden flex-1 min-w-0 relative"></div>
                    </div>
                </div>
            `;
        }

        // Kemas kini Baris 1 (SLOT LIVE) hanya apabila terdapat perubahan slot masa semasa (dan bergerak sekali sahaja tanpa diulang)
        if (liveChanged) {
            lastLiveSlotSignature = currentLiveSig;
            const liveBadge = document.getElementById('front-ticker-live-badge');
            const liveViewport = document.getElementById('front-ticker-live-viewport');
            if (liveBadge) {
                liveBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span> SLOT LIVE (${activeNowBookings.length})`;
            }
            if (liveViewport) {
                if (activeNowBookings.length > 0) {
                    const liveSlotSegments = activeNowBookings.map((b, idx) => {
                        const itemsList = b.type === 'facility' ? state.facilities : state.transports;
                        const item = itemsList.find(i => Number(i.id) === Number(b.itemId));
                        const itemName = item ? item.name : (b.itemName || 'Fasiliti/Kenderaan');
                        const check = isBookingCurrentlyActiveNow(b, nowMinutes);
                        return `<span class="inline-flex items-center gap-1.5 mx-5 text-[11px] font-medium text-muji-text shrink-0">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-600 text-white text-[9px] font-bold shadow-sm">
                                <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span> SLOT MASA TERKINI (${idx + 1}/${activeNowBookings.length})
                            </span>
                            <i class="fas ${b.type === 'facility' ? 'fa-building' : 'fa-bus'} text-emerald-700"></i>
                            <b class="text-emerald-950">${itemName}</b>
                            <span>• Slot Semasa: <b class="text-emerald-700">${check.currentSlotLabel}</b></span>
                            <span>• Pengguna: <b>${b.teacherName}</b> (${b.form} - ${b.className})</span>
                            <span>• Tujuan: <b>${b.purpose}</b></span>
                        </span>`;

                    liveViewport.innerHTML = `<div id="marquee-track-live" class="animate-marquee-once">${liveSlotSegments}</div>`;
                    requestAnimationFrame(() => {
                        const liveEl = document.getElementById('marquee-track-live');
                        if (liveEl) {
                            const totalWidthPx = liveEl.scrollWidth || 700;
                            const durationSec = Math.max(18, Math.round(totalWidthPx / 45));
                            liveEl.style.animationDuration = `${durationSec}s`;
                        }

                } else {

                }
            }
        }

        // Kemas kini Baris 2 (STATUS TERKINI) — Hanya 1 Rekod Paling Baru Sahaja & Bergerak Sekali Sahaja Tanpa Diulang
        if (statusChanged) {
            lastLatestStatusSignature = currentStatusSig;
            const statusViewport = document.getElementById('front-ticker-status-viewport');
            if (statusViewport) {
                if (latestBooking) {
                    const b = latestBooking;
                    const itemsList = b.type === 'facility' ? state.facilities : state.transports;
                    const item = itemsList.find(i => Number(i.id) === Number(b.itemId));
                    const itemName = item ? item.name : (b.itemName || 'Fasiliti/Kenderaan');
                    const slotText = formatSlotDisplay(b);
                    const st = String(b.status || 'pending').trim().toLowerCase();
                    const isApproved = st === 'approved' || st === 'lulus';

                    const actionTitleBadge = isApproved
                        ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-green-100 text-green-800 border border-green-300 text-[9px] font-bold shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>KELULUSAN BERJAYA (LULUS)</span>`
                        : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 text-[9px] font-bold shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>PERMOHONAN BARU BERJAYA DIHANTAR (MENUNGGU)</span>`;

                    const singleStatusHtml = `<span onclick="renderStatus()" class="cursor-pointer inline-flex items-center gap-1.5 mx-4 text-[11px] text-muji-text hover:text-muji-accent transition-colors shrink-0">
                        ${actionTitleBadge}
                        <i class="fas ${b.type === 'facility' ? 'fa-building' : 'fa-bus'} text-muji-accent"></i>
                        <b>${itemName}</b>
                        <span class="text-muji-muted">(${b.date} • ${slotText})</span>
                        <span>— Pemohon: <b>${b.teacherName}</b> (${b.form} - ${b.className})</span>
                        <span>• Tujuan: <b>${b.purpose}</b></span>
                    </span>`;

                    statusViewport.innerHTML = `<div id="marquee-track-status" class="animate-marquee-once">${singleStatusHtml}</div>`;
                    requestAnimationFrame(() => {
                        const statusEl = document.getElementById('marquee-track-status');
                        if (statusEl) {
                            const totalWidthPx = statusEl.scrollWidth || 700;
                            const durationSec = Math.max(18, Math.round(totalWidthPx / 45));
                            statusEl.style.animationDuration = `${durationSec}s`;

    function scrollFacilitySlider(direction) {
        const slider = document.getElementById('facility-thumbnail-slider');
        if (!slider) return;

    function quickBook(type, itemId) {
        currentBookingTab = type;
        renderBookingForm(itemId);
    }

    function setCalendarView(view) {
        currentCalendarView = view;
        renderHome();
    }

    function changeCalendarPeriod(dir) {
        if (currentCalendarView === 'day') {
            currentCalendarDate.setDate(currentCalendarDate.getDate() + dir);
            selectedFilterDate = formatDateISO(currentCalendarDate);
        } else if (currentCalendarView === 'week') {
            currentCalendarDate.setDate(currentCalendarDate.getDate() + (dir * 7));
        } else if (currentCalendarView === 'month') {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + dir);
        } else if (currentCalendarView === 'year') {
            currentCalendarDate.setFullYear(currentCalendarDate.getFullYear() + dir);
        }
        renderCalendar();
        renderScheduleByDate(selectedFilterDate);
    }

    function formatDateISO(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function selectDate(dateStr) {
        selectedFilterDate = dateStr;
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            currentCalendarDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }
        renderCalendar();
        renderScheduleByDate(selectedFilterDate);
    }

    function selectMonthInYear(monthIdx) {
        currentCalendarDate.setMonth(monthIdx);
        currentCalendarView = 'month';
        renderHome();
    }

    function renderCalendar() {
        const titleEl = document.getElementById('calendar-title');
        const bodyEl = document.getElementById('calendar-body');
        if (!bodyEl || !titleEl) return;

        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();
        const monthNames = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];

        if (currentCalendarView === 'month') {
            titleEl.innerText = `${monthNames[month]} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let daysHtml = `
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-muji-muted mb-2">
                    <div>Ahd</div><div>Isn</div><div>Sel</div><div>Rab</div><div>Kha</div><div>Jum</div><div>Sab</div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs">
            `;
            for (let i = 0; i < firstDay; i++) daysHtml += `<div></div>`;
            for (let i = 1; i <= daysInMonth; i++) {
                let d = new Date(year, month, i);
                let dateStr = formatDateISO(d);
                let hasBooking = state.bookings.some(b => b.date === dateStr && b.status !== 'rejected');
                let isSelected = dateStr === selectedFilterDate;
                let baseClasses = "py-2 rounded-xl cursor-pointer transition-all relative ";
                baseClasses += isSelected ? "bg-muji-accent text-white shadow-md font-bold" : "hover:bg-gray-100 text-muji-text";
                let indicator = hasBooking && !isSelected ? `<div class="w-1.5 h-1.5 bg-muji-warning rounded-full absolute bottom-1 left-1/2 transform -translate-x-1/2"></div>` : '';
                daysHtml += `<div class="${baseClasses}" onclick="selectDate('${dateStr}')">${i}${indicator}</div>`;
            }
            daysHtml += `</div>`;
            bodyEl.innerHTML = daysHtml;
        } else if (currentCalendarView === 'day') {
            titleEl.innerText = `${currentCalendarDate.getDate()} ${monthNames[month]} ${year}`;
            bodyEl.innerHTML = `
                <div class="text-center py-2">
                    <p class="text-xs text-muji-muted">Tarikh Dipilih:</p>
                    <p class="text-base font-bold text-muji-accent mt-0.5">${selectedFilterDate}</p>
                </div>
            `;
        } else if (currentCalendarView === 'week') {
            let startOfWeek = new Date(currentCalendarDate);
            startOfWeek.setDate(currentCalendarDate.getDate() - currentCalendarDate.getDay());
            let endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            titleEl.innerText = `${startOfWeek.getDate()} ${monthNames[startOfWeek.getMonth()].slice(0,3)} - ${endOfWeek.getDate()} ${monthNames[endOfWeek.getMonth()].slice(0,3)} ${year}`;
            let daysHtml = `
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-muji-muted mb-2">
                    <div>Ahd</div><div>Isn</div><div>Sel</div><div>Rab</div><div>Kha</div><div>Jum</div><div>Sab</div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs">
            `;
            for (let i = 0; i < 7; i++) {
                let curr = new Date(startOfWeek);
                curr.setDate(startOfWeek.getDate() + i);
                let dateStr = formatDateISO(curr);
                let hasBooking = state.bookings.some(b => b.date === dateStr && b.status !== 'rejected');
                let isSelected = dateStr === selectedFilterDate;
                let baseClasses = "py-2.5 rounded-xl cursor-pointer transition-all relative ";
                baseClasses += isSelected ? "bg-muji-accent text-white shadow-md font-bold" : "hover:bg-gray-100 text-muji-text";
                let indicator = hasBooking && !isSelected ? `<div class="w-1.5 h-1.5 bg-muji-warning rounded-full absolute bottom-1 left-1/2 transform -translate-x-1/2"></div>` : '';
                daysHtml += `<div class="${baseClasses}" onclick="selectDate('${dateStr}')">${curr.getDate()}${indicator}</div>`;
            }
            daysHtml += `</div>`;
            bodyEl.innerHTML = daysHtml;
        } else if (currentCalendarView === 'year') {
            titleEl.innerText = `Tahun ${year}`;
            let monthsHtml = `<div class="grid grid-cols-3 gap-2 text-center text-xs">`;
            monthNames.forEach((mName, idx) => {
                const monthPrefix = `${year}-${String(idx + 1).padStart(2, '0')}`;
                const count = state.bookings.filter(b => b.date.startsWith(monthPrefix) && b.status !== 'rejected').length;
                monthsHtml += `
                    <div onclick="selectMonthInYear(${idx})" class="p-3 rounded-xl border border-muji-border hover:border-muji-accent cursor-pointer bg-muji-bg transition-all">
                        <div class="font-bold text-muji-text">${mName}</div>
                        <div class="text-[10px] text-muji-muted mt-1">${count} tempahan</div>
                    </div>
                `;
            });
            monthsHtml += `</div>`;
            bodyEl.innerHTML = monthsHtml;
        }
    }

    function renderScheduleByDate(dateStr) {
        const container = document.getElementById('schedule-container');
        if (!container) return;
        const list = state.bookings.filter(b => b.date === dateStr && b.status !== 'rejected');

        if (list.length === 0) {
            container.innerHTML = `
                <div class="bg-white p-5 rounded-2xl border border-muji-border text-center">
                    <i class="fas fa-calendar-check text-2xl text-muji-muted mb-2"></i>
                    <p class="text-xs text-muji-muted">Tiada tempahan pada tarikh <b>${dateStr}</b>. Semua fasiliti & kenderaan masih kosong.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = list.map(b => {
            const itemsList = b.type === 'facility' ? state.facilities : state.transports;
            const item = itemsList.find(i => Number(i.id) === Number(b.itemId));
            const itemName = item ? item.name : (b.itemName || 'Fasiliti');
            const itemImg = item && item.img ? item.img : 'https://placehold.co/100x100/A6927C/ffffff?text=Item';
            const slotNames = formatSlotDisplay(b);

                ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-[10px] rounded-full bg-green-100 text-green-700 font-bold"><span class="w-2 h-2 rounded-full bg-green-500"></span>Lulus</span>`
                : `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-[10px] rounded-full bg-amber-100 text-amber-700 font-bold"><span class="w-2 h-2 rounded-full bg-amber-500"></span>Menunggu</span>`;

            return `

                    <div class="flex-1 min-w-0">

                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-muji-accent">${b.type === 'facility' ? 'Fasiliti' : 'Kenderaan'}</span>

                        <p class="text-xs text-muji-text mt-1 bg-muji-bg p-2 rounded-lg"><b>Tujuan:</b> ${b.purpose} (${b.subject})</p>

    function initSignaturePad() {
        const canvas = document.getElementById('applicant-signature-canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width || 360;
        canvas.height = rect.height || 112;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            const clientX = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
            return { x: clientX - r.left, y: clientY - r.top };
        };

        const startDraw = (e) => {
            e.preventDefault();
            isDrawingSignature = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        };

        const moveDraw = (e) => {
            if (!isDrawingSignature) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            applicantSignatureDataUrl = canvas.toDataURL('image/png');
        };

        const endDraw = () => {
            if (isDrawingSignature) {
                isDrawingSignature = false;
                applicantSignatureDataUrl = canvas.toDataURL('image/png');
            }
        };

        canvas.onmousedown = startDraw;
        canvas.onmousemove = moveDraw;
        window.addEventListener('mouseup', endDraw);
        canvas.ontouchstart = startDraw;
        canvas.ontouchmove = moveDraw;
        canvas.ontouchend = endDraw;
    }

    function clearSignaturePad() {
        const canvas = document.getElementById('applicant-signature-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        applicantSignatureDataUrl = '';
    }

    function formatDateWithMalayDay(dateIsoStr) {
        if (!dateIsoStr) return '';
        const parts = String(dateIsoStr).split('-');
        if (parts.length !== 3) return String(dateIsoStr).toUpperCase();
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        const dt = new Date(y, m, d);
        if (isNaN(dt.getTime())) return String(dateIsoStr).toUpperCase();
        const days = ['AHAD', 'ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU'];
        const dayName = days[dt.getDay()];
        return `${String(d).padStart(2, '0')}/${String(m + 1).padStart(2, '0')}/${y} (${dayName})`;
    }

    function refreshAvailableSlots() {

        const dateVal = document.getElementById('book-date')?.value;
        const picker = document.getElementById('slot-picker');
        if (!picker) return;

            const goDateEl = document.getElementById('tr-go-date');
            const backDateEl = document.getElementById('tr-back-date');
            if (goDateEl && dateVal) goDateEl.value = dateVal;
            if (backDateEl && dateVal) backDateEl.value = dateVal;
            updateGoBackDayPreview();
        }

        const list = currentBookingTab === 'facility' ? state.facilities : state.transports;
        const selectedItemObj = list.find(i => Number(i.id) === Number(itemId));
        const disableCheck = isItemDisabledOnDate(selectedItemObj, dateVal);
        if (disableCheck.disabled) {
            picker.innerHTML = `
                <div class="col-span-2 p-4 rounded-2xl bg-red-50 border border-red-200 text-center space-y-1">
                    <div class="text-red-600 font-bold text-xs flex items-center justify-center gap-1.5">
                        <i class="fas fa-ban"></i> ${selectedItemObj ? selectedItemObj.name : 'Item ini'} Tidak Tersedia (Disabled)
                    </div>
                    <p class="text-[11px] text-red-700">${disableCheck.reason}</p>
                    <p class="text-[10px] text-red-500">Sila pilih tarikh atau ${currentBookingTab === 'facility' ? 'fasiliti' : 'kenderaan'} yang lain.</p>
                </div>
            `;
            return;
        }

        const takenBookings = state.bookings.filter(b =>
            b.type === currentBookingTab &&
            Number(b.itemId) === Number(itemId) &&
            b.date === dateVal &&
            b.status !== 'rejected'
        );

        const activeSlots = state.timeSlots.filter(s => s.active);
        let slotsHtml = activeSlots.map(slot => {
            const bookedBy = takenBookings.find(b => Array.isArray(b.slotIds) && b.slotIds.includes(slot.id));

                </button>

        if (currentBookingTab === 'transport') {
            slotsHtml += `
                <button type="button" id="slot-btn-custom" onclick="toggleCustomTransportTime()" class="col-span-2 p-2.5 rounded-xl border border-dashed ${useCustomTransportTime ? 'border-muji-accent bg-muji-accent text-white shadow-md' : 'border-muji-accent/60 bg-amber-50/60 text-muji-text'} text-center hover:border-muji-accent transition-all">
                    <div class="font-bold text-xs"><i class="fas fa-clock mr-1"></i> Lain-lain Masa (Nyatakan Masa Sendiri)</div>

    function formatTime12Hour(time24) {
        if (!time24) return '';
        const [hStr, mStr] = time24.split(':');
        let h = parseInt(hStr, 10);
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${String(h).padStart(2, '0')}:${mStr} ${ampm}`;
    }

    function toggleSlotSelection(slotId) {
        const idx = selectedBookingSlots.indexOf(slotId);
        const btn = document.getElementById(`slot-btn-${slotId}`);

            selectedBookingSlots.push(slotId);
            btn.className = "p-2.5 rounded-xl border border-muji-accent bg-muji-accent text-white text-center shadow-md transition-all";
        }
    }

    function generateMonthlyVehicleRefNo(dateStr) {
        const parts = (dateStr || new Date().toISOString().split('T')[0]).split('-');
        const year = parts[0] || new Date().getFullYear();
        const month = parts[1] || String(new Date().getMonth() + 1).padStart(2, '0');
        const monthYearSuffix = `/${month}/${year}`;
        const monthlyBookings = state.bookings.filter(b => b.type === 'transport' && b.date && b.date.startsWith(`${year}-${month}`));
        let maxSeq = monthlyBookings.length;
        monthlyBookings.forEach(b => {
            const ref = b.transportDetails && b.transportDetails.refNo ? String(b.transportDetails.refNo) : '';
            if (ref.endsWith(monthYearSuffix)) {
                const numPart = parseInt(ref.split('/')[0], 10);
                if (!isNaN(numPart) && numPart > maxSeq) maxSeq = numPart;
            }
        });
        return `${String(maxSeq + 1).padStart(2, '0')}/${month}/${year}`;
    }

    function normalizeDateToISO(dateVal) {
        if (!dateVal) return '';
        const clean = String(dateVal).replace(/^'/, '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
        const m1 = clean.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
        if (m1) return `${m1[1]}-${m1[2].padStart(2, '0')}-${m1[3].padStart(2, '0')}`;
        const m2 = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (m2) return `${m2[3]}-${m2[2].padStart(2, '0')}-${m2[1].padStart(2, '0')}`;
        return clean;
    }

    function parseTimeTokenToMinutes(token, fallbackMeridiem = '') {
        if (!token) return null;
        const clean = String(token).trim().toUpperCase();
        const m = clean.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(AM|PM|PG|PTG|MLM|PAGI|PETANG|MALAM|TENGAHARI|TENGAH\s*HARI)?/);
        if (!m) return null;
        let hr = parseInt(m[1], 10);
        const min = parseInt(m[2], 10);
        if (isNaN(hr) || isNaN(min) || hr > 23 || min > 59) return null;
        let mer = (m[3] || fallbackMeridiem || '').replace(/\s+/g, '');
        if (mer === 'PM' || mer === 'PTG' || mer === 'PETANG' || mer === 'MLM' || mer === 'MALAM' || mer === 'TENGAHARI') {
            if (hr < 12) hr += 12;
        } else if (mer === 'AM' || mer === 'PG' || mer === 'PAGI') {
            if (hr === 12) hr = 0;
        }
        return hr * 60 + min;
    }

    function extractMeridiemToken(str) {
        if (!str) return '';
        const m = String(str).toUpperCase().match(/(AM|PM|PG|PTG|MLM|PAGI|PETANG|MALAM|TENGAHARI|TENGAH\s*HARI)/);
        return m ? m[1].replace(/\s+/g, '') : '';
    }

    function parseTimeRangeToMinutes(rangeStr) {
        if (!rangeStr) return null;
        const normalized = String(rangeStr).replace(/[–—]/g, '-');
        const timeMatches = normalized.match(/\d{1,2}\s*[:.]\s*\d{2}\s*(?:AM|PM|PG|PTG|MLM|PAGI|PETANG|MALAM|TENGAHARI|TENGAH\s*HARI)?/gi);
        if (!timeMatches || timeMatches.length < 2) return null;

        const firstToken = timeMatches[0];
        const secondToken = timeMatches[1];
        const mer1 = extractMeridiemToken(firstToken);
        const mer2 = extractMeridiemToken(secondToken);

        const startM = parseTimeTokenToMinutes(firstToken, mer1 || mer2);
        const endM = parseTimeTokenToMinutes(secondToken, mer2 || mer1);
        if (startM === null || endM === null) return null;
        if (endM <= startM) return null;
        return { startM, endM };
    }

    function isBookingCurrentlyActiveNow(b, nowMinutes) {
        if (!b || b.status !== 'approved') {
            return { active: false, currentSlotLabel: '' };
        }

        const activeMatchedSlots = [];
        const rawSlotIds = Array.isArray(b.slotIds)
            ? b.slotIds
            : (b.slotIds ? String(b.slotIds).split(',').map(s => s.trim()).filter(Boolean) : []);

        for (const sid of rawSlotIds) {
            const slotObj = (state.timeSlots || []).find(t => String(t.id) === String(sid) || String(t.time) === String(sid));
            const timeLabel = slotObj ? slotObj.time : String(sid);
            const range = parseTimeRangeToMinutes(timeLabel);
            if (range && nowMinutes >= range.startM && nowMinutes < range.endM) {
                activeMatchedSlots.push(timeLabel);
            }
        }

        if (activeMatchedSlots.length > 0) {
            return { active: true, currentSlotLabel: activeMatchedSlots.join(', ') };
        }

        if (b.customTime && String(b.customTime).trim() !== '') {
            const customRange = parseTimeRangeToMinutes(String(b.customTime));
            if (customRange && nowMinutes >= customRange.startM && nowMinutes < customRange.endM) {
                return { active: true, currentSlotLabel: b.customTime };
            }
        }

        return { active: false, currentSlotLabel: '' };
    }

    function getAssignedCancelAdmin(booking) {
        const list = state.whatsappCancelAdmins || [];
        const matched = list.filter(a => {
            if (booking.type === 'facility') {
                return Array.isArray(a.facilityIds) && a.facilityIds.map(Number).includes(Number(booking.itemId));
            } else {
                return Array.isArray(a.transportIds) && a.transportIds.map(Number).includes(Number(booking.itemId));
            }
        });
        if (matched.length > 0) return matched;
        if (list.length > 0) return [list[0]];
        return [{
            id: 0,
            name: 'Admin Tempahan',
            phone: (state.adminSettings && state.adminSettings.adminPhone) ? state.adminSettings.adminPhone : '60187808059'
        }];
    }

    function sendCancelWhatsAppToAdmin(bookingId, adminPhone, adminName) {
        const b = state.bookings.find(x => Number(x.id) === Number(bookingId));
        if (!b) return;
        const itemsList = b.type === 'facility' ? state.facilities : state.transports;
        const item = itemsList.find(i => Number(i.id) === Number(b.itemId));
        const itemName = item ? item.name : (b.itemName || 'Fasiliti/Kenderaan');
        const slotNames = formatSlotDisplay(b);
        let cleanPhone = String(adminPhone || '60187808059').replace(/[^0-9]/g, '');
        if (cleanPhone.startsWith('0')) cleanPhone = '6' + cleanPhone;

        const waMsg = [
            `*PERMOHONAN PEMBATALAN TEMPAHAN*`,
            `Kepada: *${adminName || 'Admin'}*`,
            ``,
            `Assalamualaikum / Salam Sejahtera Admin,`,
            `Saya ingin memohon untuk *MEMBATALKAN* tempahan berikut:`,
            ``,
            `📌 *Kategori:* ${b.type === 'facility' ? 'Fasiliti' : 'Kenderaan'}`,
            `🏢 *Item:* ${itemName}`,
            `📅 *Tarikh:* ${b.date}`,
            `⏰ *Masa:* ${slotNames}`,
            `👤 *Nama Pemohon:* ${b.teacherName} (${b.form} - ${b.className})`,
            `📝 *Tujuan Asal:* ${b.purpose}`,
            ``,
            `Mohon jasa baik pihak Admin untuk membatalkan rekod ini di dalam sistem. Terima kasih.`
        ].join('\n');

        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(waMsg)}`, '_blank');
    }

    function requestCancelBooking(id) {
        const b = state.bookings.find(x => Number(x.id) === Number(id));
        if (!b) return;
        const itemsList = b.type === 'facility' ? state.facilities : state.transports;
        const item = itemsList.find(i => Number(i.id) === Number(b.itemId));
        const itemName = item ? item.name : (b.itemName || 'Fasiliti/Kenderaan');
        const matchedAdmins = getAssignedCancelAdmin(b);

        if (matchedAdmins.length === 1) {
            const adm = matchedAdmins[0];
            showModal(
                'Mohon Batal Melalui WhatsApp Admin',
                `Permohonan pembatalan bagi <b>${itemName}</b> (${b.date}) akan dihantar melalui WhatsApp kepada:<br><br>👤 <b>${adm.name}</b><br>📞 <b>${adm.phone}</b>`,
                [
                    { text: 'Tutup', class: 'bg-gray-100 text-gray-700 hover:bg-gray-200', onClick: () => {} },
                    { text: 'Hantar WhatsApp', class: 'bg-emerald-600 text-white hover:bg-emerald-700', onClick: () => sendCancelWhatsAppToAdmin(b.id, adm.phone, adm.name) }
                ]
            );
        } else {
            const buttonsHtml = matchedAdmins.map(adm => `
                <button onclick="closeModal(); sendCancelWhatsAppToAdmin(${b.id}, '${adm.phone}', '${adm.name.replace(/'/g, "\\'")}')" class="w-full p-2.5 mb-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 flex items-center justify-between text-left transition-all">
                    <div>
                        <div class="font-bold text-xs text-emerald-900">${adm.name}</div>
                        <div class="text-[10px] text-emerald-700">${adm.phone}</div>
                    </div>
                    <span class="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-[10px] font-bold"><i class="fab fa-whatsapp mr-1"></i>Pilih</span>
                </button>
            `).join('');
            showModal(
                'Pilih Admin Pembatalan (WhatsApp)',
                `<p class="mb-3 text-xs">Sila pilih Admin yang bertugas untuk <b>${itemName}</b>:</p>${buttonsHtml}`,
                [{ text: 'Batal', class: 'bg-gray-100 text-gray-700 hover:bg-gray-200', onClick: () => {} }]
            );
        }
    }

    function showAdminLogin() {
        const passInput = document.getElementById('admin-pass');
        const passIcon = document.getElementById('toggle-admin-pass-icon');
        const passText = document.getElementById('toggle-admin-pass-text');
        if (passInput) passInput.type = 'password';
        if (passIcon) passIcon.className = 'fas fa-eye';
        if (passText) passText.innerText = 'Show';
        document.getElementById('admin-login').classList.remove('hidden');
    }

    function closeAdminLogin() {
        document.getElementById('admin-login').classList.add('hidden');
    }

    function toggleAdminPassVisibility() {
        const passInput = document.getElementById('admin-pass');
        const passIcon = document.getElementById('toggle-admin-pass-icon');
        const passText = document.getElementById('toggle-admin-pass-text');
        if (!passInput) return;
        if (passInput.type === 'password') {
            passInput.type = 'text';
            if (passIcon) passIcon.className = 'fas fa-eye-slash text-muji-accent';
            if (passText) passText.innerText = 'Hide';
        } else {
            passInput.type = 'password';
            if (passIcon) passIcon.className = 'fas fa-eye';
            if (passText) passText.innerText = 'Show';
        }
    }

    function loginAdmin() {
        ensureSuperAdminCredentials();
        const id = document.getElementById('admin-id').value.trim();
        const pass = document.getElementById('admin-pass').value.trim();
        const matched = state.admins.find(a => a.id === id && a.pass === pass);
        if (matched) {
            currentAdminUser = {
                id: matched.id,
                role: matched.role || (matched.id === 'admin' ? 'super' : 'facility'),
                name: matched.name || matched.id
            };
            closeAdminLogin();
            document.getElementById('staff-portal').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            document.getElementById('app').classList.add('admin-mode');

            const roleMeta = getAdminRoleMeta(currentAdminUser.role);
            const badgeEl = document.getElementById('admin-role-badge');
            const userLabelEl = document.getElementById('admin-user-label');
            const titleEl = document.getElementById('admin-portal-title');
            if (badgeEl) {
                badgeEl.innerText = roleMeta.label;
                badgeEl.className = `px-2 py-0.5 rounded-full text-[10px] font-bold ${roleMeta.badgeClass}`;
            }
            if (userLabelEl) userLabelEl.innerText = `${currentAdminUser.name} (${currentAdminUser.id})`;
            if (titleEl) {
                const parsedRole = parseAdminRoleInfo(currentAdminUser.role);
                if (parsedRole.baseRole === 'facility_item') {
                    titleEl.innerText = `Dashboard Fasiliti — ${parsedRole.itemName}`;
                } else if (parsedRole.baseRole === 'transport_item') {
                    titleEl.innerText = `Dashboard Kenderaan — ${parsedRole.itemName}`;
                } else if (currentAdminUser.role === 'facility') {
                    titleEl.innerText = 'Dashboard Pengurusan Fasiliti';
                } else if (currentAdminUser.role === 'transport') {
                    titleEl.innerText = 'Dashboard Pengurusan Kenderaan';
                } else if (currentAdminUser.role === 'signer10') {
                    titleEl.innerText = 'Dashboard Penandatangan Digital (No. 10 Pegawai Aset)';
                } else if (currentAdminUser.role === 'signer11') {
                    titleEl.innerText = 'Dashboard Penandatangan Digital (No. 11 Ketua Jabatan)';
                } else {
                    titleEl.innerText = 'Portal Pengurusan Admin Utama';
                }
            }

            renderAdminSidebar();
            const allowedTabs = getAllowedAdminTabs();
            showAdminTab(allowedTabs[0] || 'dashboard');
        } else {
            customAlert('ID Pengguna atau Kata Laluan tidak sah.');
        }
    }

    function logoutAdmin() {
        currentAdminUser = null;
        document.getElementById('admin-dashboard').classList.add('hidden');
        document.getElementById('staff-portal').classList.remove('hidden');
        document.getElementById('app').classList.remove('admin-mode');
        renderHome();
    }

    function showAdminTab(tab) {
        const allowed = getAllowedAdminTabs();
        if (!allowed.includes(tab)) tab = allowed[0] || 'dashboard';
        currentAdminTab = tab;
        document.querySelectorAll('.admin-tab-btn').forEach(btn => {
            if (btn.dataset.tab === tab) {
                btn.classList.add('bg-muji-accent', 'text-white');
                btn.classList.remove('text-muji-text');
            } else {
                btn.classList.remove('bg-muji-accent', 'text-white');
                btn.classList.add('text-muji-text');
            }
        });

        const content = document.getElementById('admin-content');
        if (tab === 'dashboard') renderAdminDashboard(content);
        else if (tab === 'history') renderAdminHistory(content);
        else if (tab === 'signer10') renderDigitalSignerDashboard(content, '10');
        else if (tab === 'signer11') renderDigitalSignerDashboard(content, '11');
        else if (tab === 'facilities') renderAdminItems(content, 'facilities', 'Tetapan Fasiliti & Bilik Khas');
        else if (tab === 'transports') renderAdminItems(content, 'transports', 'Tetapan Kenderaan Sekolah');
        else if (tab === 'admins') renderAdminUsers(content);
        else if (tab === 'settings') renderAdminSettings(content);
    }

    function renderAdminDashboard(container) {
        const role = currentAdminUser ? currentAdminUser.role : 'super';

            dashboardTitle = 'Ringkasan Statistik Tempahan Fasiliti';

                    <h4 class="font-bold text-sm text-muji-text mb-4">Carta Penggunaan ${(parsed.baseRole === 'facility_item' || parsed.baseRole === 'transport_item') ? `(${parsed.itemName})` : 'Mengikut Item'}</h4>
                    <div class="h-64"><canvas id="bookingChart"></canvas></div>
                </div>
            </div>
        `;

        setTimeout(() => {
            const ctx = document.getElementById('bookingChart');
            if (!ctx) return;
            if (chartInstance) chartInstance.destroy();
            let chartItems = [];
            if (parsed.baseRole === 'facility_item') {
                chartItems = state.facilities.filter(f => Number(f.id) === Number(parsed.itemId)).map(f => ({ ...f, _t: 'facility' }));
            } else if (parsed.baseRole === 'transport_item') {
                chartItems = state.transports.filter(t => Number(t.id) === Number(parsed.itemId)).map(t => ({ ...t, _t: 'transport' }));

                chartItems = state.facilities.map(f => ({ ...f, _t: 'facility' }));
            } else if (role === 'transport') {
                chartItems = state.transports.map(t => ({ ...t, _t: 'transport' }));
            } else {
                chartItems = [...state.facilities.map(f => ({ ...f, _t: 'facility' })), ...state.transports.map(t => ({ ...t, _t: 'transport' }))];

            const labels = chartItems.map(x => x.name);
            const counts = chartItems.map(x => scopedBookings.filter(b => b.type === x._t && Number(b.itemId) === Number(x.id) && b.status !== 'rejected').length);

            chartInstance = new Chart(ctx, {

                    labels,
                    datasets: [{

                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }, 50);

    function isBookingArchivedForHistory(b, todayStr) {
        const bDate = normalizeDateToISO(b.date);
        const isPastDate = bDate && bDate < todayStr;
        const isActionTaken = b.status === 'approved' || b.status === 'rejected';
        // Masuk Bakul Simpanan jika telah dibuat tindakan (lulus/tolak) ATAU telah melepasi tarikh permohonan
        return isActionTaken || isPastDate;
    }

    function isBookingArchivedForSigner(b, step, todayStr) {
        const bDate = normalizeDateToISO(b.date);
        const isPastDate = bDate && bDate < todayStr;
        const td = b.transportDetails || {};
        if (step === '10') {
            const isActionTaken10 = td.assetOfficerStatus === 'approved' || td.assetOfficerStatus === 'rejected';
            return isActionTaken10 || isPastDate;
        } else {
            const isActionTaken11 = td.headDeptStatus === 'approved' || td.headDeptStatus === 'rejected';
            return isActionTaken11 || isPastDate;
        }
    }

    function toggleArchiveBasket(targetView) {
        if (targetView === 'history') {
            showArchiveBasketHistory = !showArchiveBasketHistory;
            showAdminTab('history');
        } else if (targetView === 'signer10') {
            showArchiveBasketSigner10 = !showArchiveBasketSigner10;
            showAdminTab('signer10');
        } else if (targetView === 'signer11') {
            showArchiveBasketSigner11 = !showArchiveBasketSigner11;
            showAdminTab('signer11');
        }
    }
